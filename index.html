/* =========================================================================
   CANVAS / RENDERING DI GIOCO
   ========================================================================= */
const canvas = document.getElementById("gameCanvas");
let ctx = null;
let dpr = window.devicePixelRatio || 1;
let canvasScale = 1; // px canvas (device) per unita' BASE_CELL, condiviso col layer mappa

// La mappa (muri, ombre/glow) non cambia frame per frame: ridisegnarla a
// mano 60 volte al secondo era la causa principale degli "scatti". Ora
// viene disegnata UNA SOLA VOLTA su un canvas offscreen ogni volta che
// cambia la mappa o la dimensione dello schermo, e ad ogni frame si fa solo
// un blit (drawImage) del bitmap gia' pronto: costa quasi nulla alla CPU/GPU.
const mazeLayer = document.createElement("canvas");
// I pallini, come i muri, non cambiano posizione: l'unica cosa che varia
// e' quali sono gia' stati "mangiati". Ridisegnarli tutti con il loro
// glow (shadowBlur, molto costoso per il canvas 2D) ad ogni frame a
// 60fps era la causa principale degli scatti. Ora, come per la mappa,
// vengono disegnati su un layer offscreen che viene rigenerato SOLO
// quando un pallino viene davvero mangiato (evento raro, non 60 volte al
// secondo) o quando cambia la mappa/dimensione schermo; ad ogni frame si
// fa solo un blit.
const pelletsLayer = document.createElement("canvas");
let pelletsLayerDirty = true;

function setupCanvas(){
  const aspect = mazeW / mazeH;
  const wrap = document.getElementById("canvasWrap");
  const availW = Math.max(wrap.clientWidth || 0, 260);
  const availH = Math.max(wrap.clientHeight || 0, window.innerHeight * 0.5, 260);
  let cssW = availW;
  let cssH = cssW / aspect;
  if (cssH > availH){
    cssH = availH;
    cssW = cssH * aspect;
  }

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvasScale = (cssW * dpr) / (mazeW * BASE_CELL);

  canvas.width = Math.round(mazeW * BASE_CELL * canvasScale);
  canvas.height = Math.round(mazeH * BASE_CELL * canvasScale);
  canvas.style.width = Math.round(cssW) + "px";
  canvas.style.height = Math.round(cssH) + "px";
  if (!ctx){
    // alpha:false - lo sfondo del canvas e' sempre completamente opaco
    // (drawMaze ridisegna l'intero rettangolo ad ogni frame), quindi il
    // browser non deve calcolare la trasparenza contro cio' che sta
    // sotto: un frame in meno da comporre.
    // desynchronized:true - chiede al browser, dove supportato, di
    // presentare i frame del canvas il prima possibile invece di
    // sincronizzarli con l'intero ciclo di rendering della pagina: e'
    // l'opzione pensata apposta per giochi/app in tempo reale via
    // Canvas2D, e riduce la latenza percepita tra un input e cio' che
    // appare a schermo. Va creato una sola volta (ricrearlo ad ogni
    // resize perderebbe eventuale stato del contesto).
    ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
  }
  ctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);

  buildMazeLayer();
  pelletsLayer.width = canvas.width;
  pelletsLayer.height = canvas.height;
  buildPelletsLayer();
}

function isWallCell(cx, cy){
  if (cx < 0 || cy < 0 || cy >= mazeH || cx >= mazeW) return true;
  return maze[cy][cx] === "#";
}

function paintMaze(targetCtx){
  const W = mazeW * BASE_CELL, H = mazeH * BASE_CELL;

  // Sfondo: gradiente radiale invece di un flat fill, per dare profondita'
  // e un leggero effetto vignetta ai bordi (come un vero cabinato arcade,
  // non un rettangolo piatto). Costa zero a runtime: e' cotto una volta
  // sola in questo layer offscreen.
  const bgBase = mazeTheme.bg || "#000000";
  const grad = targetCtx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.72);
  grad.addColorStop(0, lightenHex(bgBase, 0.06));
  grad.addColorStop(0.7, bgBase);
  grad.addColorStop(1, "#000000");
  targetCtx.fillStyle = grad;
  targetCtx.fillRect(0, 0, W, H);

  // Texture del pavimento: una sottilissima griglia di puntini sulle celle
  // libere, per dare l'idea di un'arena strutturata (stile "campo di
  // gioco") invece dello sfondo vuoto. Molto tenue per non distrarre dai
  // pallini veri.
  targetCtx.fillStyle = "rgba(255,255,255,0.035)";
  for (let y = 0; y < mazeH; y++){
    for (let x = 0; x < mazeW; x++){
      if (maze[y][x] === "#") continue;
      const cx = x * BASE_CELL + BASE_CELL / 2;
      const cy = y * BASE_CELL + BASE_CELL / 2;
      targetCtx.fillRect(cx - 0.6, cy - 0.6, 1.2, 1.2);
    }
  }

  for (let y = 0; y < mazeH; y++){
    for (let x = 0; x < mazeW; x++){
      if (maze[y][x] !== "#") continue;
      const px = x * BASE_CELL, py = y * BASE_CELL;
      const m = 1.5, r = 5;
      const palIdx = wallColorByCell[x + "," + y];
      const wc = (palIdx != null && themeWallVariants[palIdx]) ? themeWallVariants[palIdx] : mazeTheme;

      targetCtx.save();
      targetCtx.shadowColor = wc.glow;
      targetCtx.shadowBlur = 5;
      targetCtx.fillStyle = wc.wall;
      roundRectPath(targetCtx, px + m, py + m, BASE_CELL - 2 * m, BASE_CELL - 2 * m, r);
      targetCtx.fill();
      targetCtx.restore();

      // Bevel pseudo-3D: highlight in alto a sinistra, ombra in basso a
      // destra, per far sembrare i muri dei "tubi" solidi e luminosi
      // invece di rettangoli piatti.
      targetCtx.save();
      roundRectPath(targetCtx, px + m, py + m, BASE_CELL - 2 * m, BASE_CELL - 2 * m, r);
      targetCtx.clip();
      const bevel = targetCtx.createLinearGradient(px, py, px + BASE_CELL, py + BASE_CELL);
      bevel.addColorStop(0, "rgba(255,255,255,0.22)");
      bevel.addColorStop(0.35, "rgba(255,255,255,0)");
      bevel.addColorStop(0.7, "rgba(0,0,0,0)");
      bevel.addColorStop(1, "rgba(0,0,0,0.30)");
      targetCtx.fillStyle = bevel;
      targetCtx.fillRect(px, py, BASE_CELL, BASE_CELL);
      targetCtx.restore();

      targetCtx.save();
      targetCtx.strokeStyle = wc.edge;
      targetCtx.lineWidth = 1;
      roundRectPath(targetCtx, px + m, py + m, BASE_CELL - 2 * m, BASE_CELL - 2 * m, r);
      targetCtx.stroke();
      targetCtx.restore();
    }
  }
}

// Schiarisce un colore esadecimale di una frazione 0-1 (usato per i
// gradienti di sfondo/bevel). Puramente estetico.
function lightenHex(hex, amt){
  const h = hex.replace("#", "");
  if (h.length !== 6) return hex;
  const r = parseInt(h.slice(0,2), 16), g = parseInt(h.slice(2,4), 16), b = parseInt(h.slice(4,6), 16);
  const lr = Math.min(255, Math.round(r + (255 - r) * amt));
  const lg = Math.min(255, Math.round(g + (255 - g) * amt));
  const lb = Math.min(255, Math.round(b + (255 - b) * amt));
  return "rgb(" + lr + "," + lg + "," + lb + ")";
}

function buildMazeLayer(){
  if (!mazeW || !mazeH) return;
  mazeLayer.width = canvas.width;
  mazeLayer.height = canvas.height;
  const mctx = mazeLayer.getContext("2d");
  mctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
  paintMaze(mctx);
}

function drawMaze(){
  // Blit del bitmap gia' pronto: nessun ridisegno di muri/ombre a runtime.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(mazeLayer, 0, 0);
  ctx.restore();
}

function roundRectPath(targetCtx, x, y, w, h, r){
  targetCtx.beginPath();
  targetCtx.moveTo(x + r, y);
  targetCtx.arcTo(x + w, y, x + w, y + h, r);
  targetCtx.arcTo(x + w, y + h, x, y + h, r);
  targetCtx.arcTo(x, y + h, x, y, r);
  targetCtx.arcTo(x, y, x + w, y, r);
  targetCtx.closePath();
}

function buildPelletsLayer(){
  if (!mazeW || !mazeH) return;
  const pctx = pelletsLayer.getContext("2d");
  pctx.clearRect(0, 0, pelletsLayer.width, pelletsLayer.height);
  pctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
  const pelletColor = mazeTheme.pellet || "#ffe9a8";
  pctx.fillStyle = pelletColor;
  pctx.shadowColor = pelletColor;
  pctx.shadowBlur = 3;
  for (let y = 0; y < mazeH; y++){
    for (let x = 0; x < mazeW; x++){
      if (maze[y][x] === "#") continue;
      const key = x + "," + y;
      if (eatenPellets.has(key)) continue;
      if (powerPellets.has(key)) continue;  // disegnati a parte in drawPowerPellets: piu' grossi e animati
      const cx = x * BASE_CELL + BASE_CELL / 2;
      const cy = y * BASE_CELL + BASE_CELL / 2;
      pctx.beginPath();
      pctx.arc(cx, cy, 2.1, 0, Math.PI * 2);
      pctx.fill();
    }
  }
  pctx.shadowBlur = 0;
  pelletsLayerDirty = false;
}

// Pallini "power" (10 punti, arancioni): disegnati ogni frame, non nel
// layer statico cache, cosi' possono pulsare ed essere inequivocabilmente
// piu' grandi dei pallini normali (raggio quasi triplo + alone + anello).
function drawPowerPellets(now){
  if (!powerPellets.size) return;
  const pulse = 1 + 0.18 * Math.sin(now / 260);
  ctx.save();
  powerPellets.forEach(function(key){
    if (eatenPellets.has(key)) return;
    const parts = key.split(",");
    const x = parseInt(parts[0], 10), y = parseInt(parts[1], 10);
    const cx = x * BASE_CELL + BASE_CELL / 2;
    const cy = y * BASE_CELL + BASE_CELL / 2;
    const r = 6.5 * pulse;
    ctx.fillStyle = "#ff9d1f";
    ctx.shadowColor = "#ff9d1f";
    ctx.shadowBlur = 9;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,240,210,0.9)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 1.5, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.restore();
}

function drawPellets(){
  if (pelletsLayerDirty) buildPelletsLayer();
  // Blit del bitmap gia' pronto: nessun ridisegno di pallini/glow a runtime.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(pelletsLayer, 0, 0);
  ctx.restore();
}

// ---- corpo "classico" tondo con bocca a spicchio ----
function drawRoundBody(radius, m, primary, secondary, glowExtra){
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, radius, m, Math.PI * 2 - m);
  ctx.closePath();
  ctx.fillStyle = primary;
  ctx.shadowColor = primary;
  ctx.shadowBlur = 8 + (glowExtra || 0);
  ctx.fill();
  ctx.shadowBlur = 0;
  if (secondary){
    ctx.strokeStyle = secondary;
    ctx.lineWidth = Math.max(1.3, radius * 0.10);
    ctx.stroke();
  }
}

// ---- corpo esagonale, bocca ritagliata via composite ----
function drawHexBody(radius, m, primary, secondary, glowExtra){
  const pts = [];
  for (let k = 0; k < 6; k++){
    const a = k * Math.PI / 3;
    pts.push([Math.cos(a) * radius, Math.sin(a) * radius]);
  }
  const path = function(){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 6; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  };
  path();
  ctx.fillStyle = primary;
  ctx.shadowColor = primary;
  ctx.shadowBlur = 8 + (glowExtra || 0);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, radius * 1.05, m, Math.PI * 2 - m);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  if (secondary){
    path();
    ctx.strokeStyle = secondary;
    ctx.lineWidth = Math.max(1.3, radius * 0.10);
    ctx.stroke();
  }
}

// ---- fila di dentini triangolari lungo un bordo della bocca ----
function drawTeethRow(x0, y0, x1, y1, color, toothLen){
  const n = 3;
  const dx = x1 - x0, dy = y1 - y0;
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++){
    const t0 = i / n, t1 = (i + 0.55) / n;
    const bx0 = x0 + dx * t0, by0 = y0 + dy * t0;
    const bx1 = x0 + dx * t1, by1 = y0 + dy * t1;
    const midx = (bx0 + bx1) / 2, midy = (by0 + by1) / 2;
    const apexY = midy - (midy === 0 ? toothLen : Math.sign(midy) * toothLen);
    ctx.beginPath();
    ctx.moveTo(bx0, by0);
    ctx.lineTo(bx1, by1);
    ctx.lineTo(midx, apexY);
    ctx.closePath();
    ctx.fill();
  }
}

// ---- corpo tondo con bocca "a squalo": denti aguzzi sui due bordi ----
function drawSharkBody(radius, m, primary, secondary, glowExtra){
  const arcStart = [Math.cos(m) * radius, Math.sin(m) * radius];
  const arcEnd = [Math.cos(-m) * radius, Math.sin(-m) * radius];
  drawRoundBody(radius, m, primary, null, glowExtra);
  const teethColor = secondary || "#f5f5f5";
  drawTeethRow(0, 0, arcStart[0], arcStart[1], teethColor, radius * 0.22);
  drawTeethRow(0, 0, arcEnd[0], arcEnd[1], teethColor, radius * 0.22);
}

// ---- occhio singolo (ciclope / arrabbiato), colorato col colore di
// dettaglio scelto dal giocatore (iride), con sopracciglio per l'arrabbiato
function drawSingleEye(radius, secondary, angry){
  const eyeR = radius * 0.42;
  const ex = radius * 0.12, ey = 0;
  ctx.beginPath();
  ctx.ellipse(ex, ey, eyeR, eyeR * 0.9, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#f5f7ff";
  ctx.fill();
  const iris = secondary || "#1b2440";
  const pdx = eyeR * 0.35;
  ctx.beginPath();
  ctx.arc(ex + pdx, ey, eyeR * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = iris;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex + pdx, ey, eyeR * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = "#000";
  ctx.fill();
  if (angry){
    ctx.strokeStyle = secondary || "#1b2440";
    ctx.lineWidth = Math.max(1.4, radius * 0.11);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ex - eyeR * 0.95, ey - eyeR * 1.2);
    ctx.lineTo(ex + eyeR * 0.95, ey - eyeR * 0.5);
    ctx.stroke();
  }
}

// Disegna il personaggio scelto dal giocatore: corpo (secondo il tipo) +
// colore primario/dettaglio. rotationDeg orienta l'intero personaggio nella
// direzione di marcia, esattamente come faceva il vecchio drawPacman.
function drawPacmanVariant(px, py, radius, mouthDeg, rotationDeg, primaryHex, secondaryHex, charId, glowExtra){
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(rotationDeg * Math.PI / 180);
  const m = Math.max(2, mouthDeg) * Math.PI / 180;
  switch (charId){
    case "hex":
      drawHexBody(radius, m, primaryHex, secondaryHex, glowExtra);
      break;
    case "shark":
      drawSharkBody(radius, m, primaryHex, secondaryHex, glowExtra);
      break;
    case "cyclops":
      drawRoundBody(radius, m, primaryHex, secondaryHex, glowExtra);
      drawSingleEye(radius, secondaryHex, false);
      break;
    case "angry":
      drawRoundBody(radius, m, primaryHex, secondaryHex, glowExtra);
      drawSingleEye(radius, secondaryHex, true);
      break;
    default:
      drawRoundBody(radius, m, primaryHex, secondaryHex, glowExtra);
      break;
  }
  ctx.restore();
}

function getRenderedPos(p, now){
  if (p.id === myId && predInited){
    return { x: predGridX + (predDir ? DIR_VEC[predDir][0] * predAccum : 0),
             y: predGridY + (predDir ? DIR_VEC[predDir][1] * predAccum : 0) };
  }
  const s = remoteSim[p.id];
  if (s){
    return { x: s.gridX + (s.dir ? DIR_VEC[s.dir][0] * s.accum : 0),
             y: s.gridY + (s.dir ? DIR_VEC[s.dir][1] * s.accum : 0) };
  }
  return { x: p.x, y: p.y };
}

// Funzione generica di avanzamento simulazione, usata sia per il proprio
// personaggio (con coda di direzione "next", alimentata dall'input locale)
// sia per tutti gli altri (con direzione presa dall'ultimo stato ricevuto
// dal server). Stesse regole di common.py/main.py: velocita' in celle al
// secondo, blocco sui muri, avanzamento a celle intere. Chiamata ad ogni
// frame dal render loop, cosi' il movimento resta visivamente fluido anche
// tra un pacchetto di rete e l'altro.
function stepSim(state, dt, speed, hasNextDirQueue){
  if (dt <= 0) return;
  let remaining = dt;
  // Se il tab e' stato in background, dt puo' essere enorme: limitiamolo
  // per evitare che il personaggio "teletrasporti" attraverso i muri.
  if (remaining > 0.25) remaining = 0.25;

  while (remaining > 0){
    // Stessa regola del server (vedi update_movement in main.py): la
    // svolta in coda si applica SUBITO, non solo su un incrocio.
    // Aspettare l'incrocio sembrava piu' pulito, ma client e server non
    // attraversano MAI il confine di cella nello stesso identico istante
    // (millisecondo): la discrepanza faceva scattare la correzione forte,
    // il teletrasporto. Girando subito con la stessa regola semplice
    // ("se non e' muro, gira ora") client e server restano sincronizzati.
    // Resta il problema originale (riusare l'accum sull'asse sbagliato
    // fa "saltare" il personaggio): per questo, quando la direzione
    // cambia davvero, si azzera l'avanzamento frazionario, cosi' il
    // movimento nella nuova direzione riparte pulito dal centro della
    // cella corrente - uno scatto piccolo e deterministico, identico su
    // client e server, non piu' un grosso teletrasporto di rete.
    if (hasNextDirQueue && state.nextDir){
      const v = DIR_VEC[state.nextDir];
      if (!isWallCell(state.gridX + v[0], state.gridY + v[1])){
        if (state.dir !== state.nextDir) state.accum = 0;
        state.dir = state.nextDir;
        state.nextDir = null;
      }
    }
    if (!state.dir){ break; }
    const v = DIR_VEC[state.dir];
    const nx = state.gridX + v[0], ny = state.gridY + v[1];
    if (isWallCell(nx, ny)){
      state.accum = 0;
      break;
    }
    const step = Math.min(remaining, (1 - state.accum) / speed);
    state.accum += speed * step;
    remaining -= step;
    if (state.accum >= 1 - 1e-6){
      state.accum = 0;
      state.gridX = nx;
      state.gridY = ny;
      // Appena attraversato il confine, si ricontrolla subito la coda
      // (prossimo giro del while, se resta tempo) oppure al prossimo frame:
      // in entrambi i casi accum e' 0, quindi il controllo sopra la lascera'
      // scattare senza alcun salto.
    } else {
      break;
    }
  }
}

// Avanza la simulazione locale del proprio personaggio (wrapper su stepSim
// che usa le variabili globali pred* per compatibilita' col resto del
// codice, ad es. gli handler di input che le leggono/scrivono).
function stepLocalPrediction(dt, isAssassin){
  if (!predInited) return;
  let speed = NORMAL_SPEED * (isAssassin ? ASSASSIN_SPEED_MULT : 1);
  const state = { gridX: predGridX, gridY: predGridY, accum: predAccum, dir: predDir, nextDir: predNextDir };
  stepSim(state, dt, speed, true);
  predGridX = state.gridX; predGridY = state.gridY; predAccum = state.accum;
  predDir = state.dir; predNextDir = state.nextDir;
}

// Avanza la simulazione "dead reckoning" di un giocatore remoto: continua
// nella direzione riportata dall'ultimo stato del server finche' non arriva
// una correzione, invece di restare fermo in attesa del prossimo pacchetto.
function stepRemoteSim(p, dt){
  const s = remoteSim[p.id];
  if (!s || !p.alive) return;
  let speed = NORMAL_SPEED * (p.assassin ? ASSASSIN_SPEED_MULT : 1);
  stepSim(s, dt, speed, false);
}

let lastFacingMap = {};
function computeFacing(p){
  if (p.id === myId && predInited && predDir){
    return DIR_ANGLE[predDir];
  }
  const s = remoteSim[p.id];
  if (s && s.dir){
    return DIR_ANGLE[s.dir];
  }
  return lastFacingMap[p.id] || 0;
}

// Calcolata una sola volta invece che ad ogni giocatore/frame: vedi nota
// in drawPlayers piu' sotto.
const PLAYER_NAME_FONT = "8px " + getComputedStyle(document.body).fontFamily;

function drawPlayers(players, now){
  players.forEach(function(p){
    const pos = getRenderedPos(p, now);
    const px = pos.x * BASE_CELL + BASE_CELL / 2;
    const py = pos.y * BASE_CELL + BASE_CELL / 2;

    if (!p.alive) return;

    const facing = computeFacing(p);
    lastFacingMap[p.id] = facing;

    // ---- MODALITA' FANTASMA (bonus rimosso) e SUPER ASSASSINO (300 punti) ----
    // Chi e' fantasma o super assassino e' invisibile agli ALTRI giocatori
    // (nome incluso); a SE STESSO si vede in modo diverso (alone
    // tratteggiato per il fantasma, alone rosso pulsante per l'assassino),
    // per sapere che la modalita' e' attiva.
    const iAmGhost = !!p.ghost;
    const iAmAssassin = !!p.assassin;
    if ((iAmGhost || iAmAssassin) && p.id !== myId) return;  // invisibile agli altri

    const chompSpeed = 8;
    const mouthDeg = 8 + 24 * Math.abs(Math.sin(now / 1000 * chompSpeed));
    const colors = p.colors || [];
    const baseColor = COLOR_HEX[colors[0]] || "#fff";
    const detailColor = colors[1] ? COLOR_HEX[colors[1]] : null;
    const radius = BASE_CELL * 0.42;

    ctx.save();

    // Protezione post-respawn (vita extra): lampeggia.
    if (p.prot){
      ctx.globalAlpha = 0.35 + 0.35 * Math.abs(Math.sin(now / 120));
    }
    // Fantasma visto da me stesso: molto trasparente + aura tratteggiata.
    if (iAmGhost){
      ctx.globalAlpha = Math.min(ctx.globalAlpha, 0.40);
      ctx.save();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = "rgba(200,220,255,0.7)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(px, py, radius + 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // Super assassino visto da me stesso: leggermente trasparente + alone
    // rosso pulsante, per ricordare che sono invisibile e letale al tocco.
    // Nei primi ~900ms dopo l'attivazione (assassinFxAt) si vede anche
    // un'onda d'urto che si restringe e una dissolvenza graduale, cosi' si
    // percepisce chiaramente il MOMENTO in cui si diventa invisibili.
    if (iAmAssassin){
      const sinceFx = now - assassinFxAt;
      const transitioning = sinceFx >= 0 && sinceFx < 900;
      const fadeT = transitioning ? Math.min(1, sinceFx / 900) : 1;
      const startAlpha = 1.0, endAlpha = 0.55;
      ctx.globalAlpha = Math.min(ctx.globalAlpha, startAlpha - (startAlpha - endAlpha) * fadeT);
      ctx.save();
      ctx.strokeStyle = "rgba(255,50,50,0.85)";
      ctx.lineWidth = 2;
      const pulse = 3 + 3 * Math.abs(Math.sin(now / 150));
      ctx.beginPath();
      ctx.arc(px, py, radius + pulse, 0, Math.PI * 2);
      ctx.stroke();
      if (transitioning){
        // Onda d'urto che parte larga e si restringe fino all'alone finale.
        ctx.globalAlpha = 1 - fadeT;
        ctx.strokeStyle = "rgba(255,120,90,0.9)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(px, py, radius + pulse + (1 - fadeT) * 26, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    drawPacmanVariant(px, py, radius, mouthDeg, facing, baseColor, detailColor, p.character || "classic", 0);

    // Laser sbloccato (bonus 150 punti, dura 1 min): puntino rosso davanti alla bocca.
    if (p.laser && facing != null){
      const rad = facing * Math.PI / 180;
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = "#ff3b5c";
      ctx.beginPath();
      ctx.arc(px + Math.cos(rad) * (radius + 3), py + Math.sin(rad) * (radius + 3), 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Bonus 500 punti: nemico intrappolato, immobile per 15s. Visibile a
    // tutti (cosi' si capisce perche' non si muove), anello dorato tratteggiato
    // che ruota lentamente.
    if (p.trapped){
      ctx.save();
      ctx.strokeStyle = "rgba(255,209,102,0.9)";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.translate(px, py);
      ctx.rotate(now / 500);
      ctx.beginPath();
      ctx.arc(0, 0, radius + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();

    // Nome (il fantasma visto da se' non mostra il nome, per non ingombrare).
    if (!iAmGhost){
      ctx.save();
      ctx.font = PLAYER_NAME_FONT;
      ctx.textAlign = "center";
      ctx.fillStyle = "#000";
      ctx.globalAlpha = 0.7;
      ctx.fillText(p.name, px + 0.5, py - radius - 4.5);
      ctx.globalAlpha = 1;
      ctx.fillStyle = baseColor;
      ctx.fillText(p.name, px, py - radius - 5);
      ctx.restore();
    }
  });
}

function findPlayer(snapshot, id){
  if (!snapshot) return null;
  for (let i = 0; i < snapshot.players.length; i++){
    if (snapshot.players[i].id === id) return snapshot.players[i];
  }
  return null;
}
function lerp(a, b, t){ return a + (b - a) * t; }

// Punto 4: i due portali. Doppio anello controrotante nei colori del tema,
// con un piccolo vortice interno. Economico (nessun shadowBlur).
function drawPortals(now){
  if (!portals || portals.length < 2) return;
  const colA = mazeTheme.edge || "#4d7bff";
  const colB = mazeTheme.glow || "#9df6ff";
  portals.forEach(function(pt, idx){
    const cx = pt[0] * BASE_CELL + BASE_CELL / 2;
    const cy = pt[1] * BASE_CELL + BASE_CELL / 2;
    const r = BASE_CELL * 0.42;
    const spin = now / 1000 * (idx === 0 ? 1 : -1);
    ctx.save();
    ctx.translate(cx, cy);
    for (let ring = 0; ring < 2; ring++){
      ctx.rotate(spin * (ring ? -1.6 : 1.2));
      ctx.strokeStyle = ring ? colB : colA;
      ctx.globalAlpha = 0.85 - ring * 0.25;
      ctx.lineWidth = 2;
      for (let a = 0; a < 3; a++){
        const start = a * (Math.PI * 2 / 3);
        ctx.beginPath();
        ctx.arc(0, 0, r - ring * 3, start, start + Math.PI / 2);
        ctx.stroke();
      }
    }
    // nucleo
    ctx.globalAlpha = 0.5 + 0.3 * Math.abs(Math.sin(now / 300));
    ctx.fillStyle = colB;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// Bonus 150 punti: il laser e' ora un singolo proiettile in movimento
// (niente piu' raggio istantaneo). La posizione e' quella autoritativa
// mandata dal server ad ogni tick (currSnapshot.lasers): si disegna come
// un piccolo "doppio trattino" (=) orientato nella direzione di marcia.
function drawLaserProjectiles(now){
  const list = (currSnapshot && currSnapshot.lasers) || [];
  if (!list.length) return;
  ctx.save();
  ctx.strokeStyle = "#ff3b5c";
  ctx.lineCap = "round";
  list.forEach(function(lz){
    const cx = lz.x * BASE_CELL + BASE_CELL / 2;
    const cy = lz.y * BASE_CELL + BASE_CELL / 2;
    const angle = Math.atan2(lz.dir[1], lz.dir[0]);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    // Bagliore morbido dietro al colpo.
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#ff3b5c";
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    // Doppio trattino "=" perpendicolare alla direzione di marcia.
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-3, -2.6); ctx.lineTo(3, -2.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3, 2.6); ctx.lineTo(3, 2.6); ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, 0, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

// Scintille per rimbalzo (funzione non piu' sbloccabile da alcun bonus) o estinzione del proiettile.
function drawSparks(now){
  sparks = sparks.filter(function(s){ return now - s.start < 220; });
  sparks.forEach(function(s){
    const t = (now - s.start) / 220;
    const cx = s.x * BASE_CELL + BASE_CELL / 2;
    const cy = s.y * BASE_CELL + BASE_CELL / 2;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = "#ffd0d8";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++){
      const a = (i / 5) * Math.PI * 2;
      const r = 2 + t * 7;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.stroke();
    }
    ctx.restore();
  });
}

// Mine posate sulla mappa (bonus 200 punti): un piccolo disco lampeggiante.
// Visibili SOLO a chi le ha posate: agli avversari restano nascoste finche'
// non esplodono (vedi richiesta punto 3).
function drawMines(now){
  const all = (currSnapshot && currSnapshot.mines) || [];
  const list = all.filter(function(m){ return m.owner === myId; });
  if (!list.length) return;
  ctx.save();
  list.forEach(function(m){
    const cx = m.x * BASE_CELL + BASE_CELL / 2;
    const cy = m.y * BASE_CELL + BASE_CELL / 2;
    const pulse = 0.6 + 0.4 * Math.abs(Math.sin(now / 200));
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#ff9d1f";
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx, cy, 1.6, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

// Missile guidato (bonus 400 punti): a differenza delle mine e' visibile a
// TUTTI (non solo a chi l'ha sparato), con un piccolo nucleo luminoso e un
// alone azzurro: insegue il nemico piu' vicino seguendo i corridoi.
function drawMissiles(now){
  const list = (currSnapshot && currSnapshot.missiles) || [];
  if (!list.length) return;
  ctx.save();
  list.forEach(function(mz){
    const cx = mz.x * BASE_CELL + BASE_CELL / 2;
    const cy = mz.y * BASE_CELL + BASE_CELL / 2;
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = "#8fd3ff";
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = "#e8f7ff";
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#5ab8ff";
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.stroke();
  });
  ctx.restore();
}

// Effetto di teletrasporto (punto 4): anelli che si espandono dai due portali.
function drawSwirls(now){
  swirls = swirls.filter(function(s){ return now - s.start < 420; });
  swirls.forEach(function(s){
    const t = (now - s.start) / 420;
    const cx = s.x * BASE_CELL + BASE_CELL / 2;
    const cy = s.y * BASE_CELL + BASE_CELL / 2;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 2 + t * 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

// Punto 5: particelle atmosferiche a tema. Movimento in coordinate-cella,
// riciclate quando escono dallo schermo. Poche e leggere.
function updateThemeFx(dt){
  if (!themeFxKind || !themeFx.length) return;
  const d = Math.min(dt, 0.1);
  themeFx.forEach(function(p, i){
    p.phase += d * (1 + p.seed);
    switch (themeFxKind){
      case "embers":   p.y -= d * (1.2 + p.seed);     p.x += Math.sin(p.phase) * d * 0.4; break;
      case "neon":     p.y -= d * (2.0 + p.seed * 2); break;
      case "hearts":   p.y -= d * (0.8 + p.seed);     p.x += Math.sin(p.phase) * d * 0.5; break;
      case "bubbles":  p.y -= d * (1.0 + p.seed);     p.x += Math.sin(p.phase) * d * 0.3; break;
      case "snow":     p.y += d * (0.9 + p.seed);     p.x += Math.sin(p.phase) * d * 0.4; break;
      case "leaves":   p.y += d * (0.9 + p.seed);     p.x += Math.sin(p.phase) * d * 0.9; break;
      case "sand":     p.x += d * (1.2 + p.seed);     p.y += Math.sin(p.phase) * d * 0.25; break;
      case "fireflies":p.x += Math.cos(p.phase) * d * 0.6; p.y += Math.sin(p.phase * 1.3) * d * 0.6; break;
      case "sparkle": case "stars": default: /* fermi, solo twinkle via phase */ break;
    }
    // riciclo ai bordi
    if (p.y < -1 || p.y > mazeH + 1 || p.x < -1 || p.x > mazeW + 1){
      themeFx[i] = spawnFxParticle(false);
    }
  });
}
function drawThemeFx(now){
  if (!themeFxKind || !themeFx.length) return;
  const col = mazeTheme.glow || "#ffffff";
  ctx.save();
  themeFx.forEach(function(p){
    const cx = p.x * BASE_CELL, cy = p.y * BASE_CELL;
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(p.phase));
    ctx.globalAlpha = 0.5 * tw;
    if (themeFxKind === "hearts"){
      ctx.fillStyle = "#ff8fce";
      ctx.beginPath(); ctx.arc(cx, cy, 1.8, 0, Math.PI * 2); ctx.fill();
    } else if (themeFxKind === "leaves"){
      ctx.fillStyle = col;
      ctx.fillRect(cx - 1.4, cy - 1.4, 2.8, 2.8);
    } else if (themeFxKind === "stars" || themeFxKind === "sparkle"){
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(cx, cy, 1.2 * tw + 0.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  });
  ctx.restore();
}

function drawExplosions(now){
  explosions = explosions.filter(function(e){ return now - e.start < 550; });
  explosions.forEach(function(e){
    const t = (now - e.start) / 550;
    const px = e.x * BASE_CELL + BASE_CELL / 2;
    const py = e.y * BASE_CELL + BASE_CELL / 2;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, 4 + t * 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

function renderLoop(now){
  requestAnimationFrame(renderLoop);
  if (currentScreen !== "game" || !ctx || !currSnapshot) return;

  const dt = lastFrameTs != null ? Math.max(0, (now - lastFrameTs) / 1000) : 0;
  lastFrameTs = now;
  const me0 = findPlayer(currSnapshot, myId);
  if (me0 && me0.alive && roundActive){
    stepLocalPrediction(dt, !!me0.assassin);
  }
  if (roundActive){
    currSnapshot.players.forEach(function(p){
      if (p.id !== myId) stepRemoteSim(p, dt);
    });
  }
  updateThemeFx(dt);

  drawMaze();
  drawPellets();
  drawPowerPellets(now);
  drawPortals(now);
  drawThemeFx(now);
  drawPlayers(currSnapshot.players, now);
  drawMines(now);
  drawMissiles(now);
  drawLaserProjectiles(now);
  drawSparks(now);
  drawExplosions(now);
  drawSwirls(now);
}
requestAnimationFrame(renderLoop);

window.addEventListener("resize", function(){ if (mazeW) setupCanvas(); });

// ResizeObserver sul contenitore del canvas: e' il modo affidabile per
// accorgersi che lo spazio disponibile e' cambiato in QUALSIASI
// situazione (entrata/uscita da fullscreen, comparsa/scomparsa della
// barra degli indirizzi su mobile, zoom, resize finestra, apertura
// devtools...). L'evento "resize" della finestra da solo non copre tutti
// questi casi, ed e' la causa principale del "quadratino piccolo" che
// restava bloccato dopo il primo render.
if (typeof ResizeObserver !== "undefined"){
  const canvasWrapEl = document.getElementById("canvasWrap");
  let roScheduled = false;
  const ro = new ResizeObserver(function(){
    if (roScheduled) return;
    roScheduled = true;
    requestAnimationFrame(function(){
      roScheduled = false;
      if (currentScreen === "game" && mazeW) setupCanvas();
    });
  });
  ro.observe(canvasWrapEl);
}

/* =========================================================================
   LOGO ANIMATO (schermata di connessione)
   ========================================================================= */
(function animateLogo(){
  const lc = document.getElementById("logoCanvas");
  const lctx = lc.getContext("2d");
  function frame(now){
    requestAnimationFrame(frame);
    lctx.clearRect(0, 0, lc.width, lc.height);
    const mouth = 8 + 26 * Math.abs(Math.sin(now / 260));
    lctx.save();
    lctx.translate(lc.width / 2, lc.height / 2);
    lctx.beginPath();
    lctx.moveTo(0, 0);
    const m = mouth * Math.PI / 180;
    lctx.arc(0, 0, 22, m, Math.PI * 2 - m);
    lctx.closePath();
    lctx.fillStyle = "#ffd400";
    lctx.shadowColor = "#ffd400";
    lctx.shadowBlur = 16;
    lctx.fill();
    lctx.restore();
  }
  requestAnimationFrame(frame);
})();

/* =========================================================================
   STATO DI GIOCO / EVENTI
   ========================================================================= */
function onState(msg){
  const now = performance.now();

  if (msg.phase === "countdown" && lastPhase !== "countdown"){
    eatenPellets.clear();
    pelletsLayerDirty = true;
    explosions = [];
    beams = [];
    sparks = [];
    swirls = [];
    remoteSim = {};
    lastServerPos = {};
    lastFacingMap = {};
    lastRequestedDir = null;
    predInited = false;
    predDir = null;
    predNextDir = null;
    predAccum = 0;
    roundActive = true;
    lastCountdownSecond = null;
    assassinFxAt = -Infinity;
    document.getElementById("endOverlay").classList.add("hidden");
    showScreen("game");
  }

  // Tic-tac da orologio per ogni secondo del countdown iniziale: un click
  // breve e pulito ad ogni cambio di secondo, cosi' l'attesa prima che
  // inizi il round suona come un orologio che scandisce il tempo, invece
  // di restare in silenzio fino allo scatto finale.
  if (msg.phase === "countdown"){
    const sec = Math.ceil(msg.countdown);
    if (sec !== lastCountdownSecond && sec > 0){
      lastCountdownSecond = sec;
      playClockTick();
    }
  }

  msg.players.forEach(function(p){
    // NB: morti, pallini mangiati, bonus, laser e teletrasporti NON si
    // deducono piu' confrontando gli snapshot: arrivano come eventi espliciti
    // dal server (vedi onGameEvent), che e' l'autorita' unica. Qui restano
    // solo posizione/direzione per la simulazione fluida dei remoti.

    // Riallinea (o inizializza) la simulazione locale di QUESTO giocatore
    // rispetto alla posizione/direzione confermata dal server: il server
    // resta l'autorita', ma tra un pacchetto e l'altro il client continua a
    // muovere il personaggio da solo (stepRemoteSim, nel render loop) con
    // le stesse regole del server, invece di restare fermo ad aspettare.
    // Questo e' cio' che elimina i "singhiozzi"/il movimento a scatti
    // quando la rete e' lenta o irregolare (come Clash Royale su dati
    // mobili): non ci si limita ad ammorbidire i pacchetti, si predice.
    if (p.id !== myId){
      const dir = p.direction;
      let gx, gy, ac;
      if (dir){
        const v = DIR_VEC[dir];
        if (v[0] !== 0){
          gx = v[0] > 0 ? Math.floor(p.x) : Math.ceil(p.x);
          gy = Math.round(p.y);
          ac = Math.max(0, Math.min(1, (p.x - gx) * v[0]));
        } else {
          gx = Math.round(p.x);
          gy = v[1] > 0 ? Math.floor(p.y) : Math.ceil(p.y);
          ac = Math.max(0, Math.min(1, (p.y - gy) * v[1]));
        }
      } else {
        gx = Math.round(p.x); gy = Math.round(p.y); ac = 0;
      }

      const prev = remoteSim[p.id];
      if (!prev || !p.alive){
        remoteSim[p.id] = { gridX: gx, gridY: gy, accum: ac, dir: dir };
      } else {
        const cur = getRenderedPos(p, now);
        const dx = cur.x - p.x, dy = cur.y - p.y;
        const errDist = Math.hypot(dx, dy);
        if (errDist > 0.6){
          // Scarto grande (spawn, teletrasporto, correzione forte): snap.
          remoteSim[p.id] = { gridX: gx, gridY: gy, accum: ac, dir: dir };
        } else {
          // Scarto piccolo: correzione morbida senza scatti visibili, la
          // simulazione continua a muoversi con la direzione aggiornata.
          prev.dir = dir;
          if (errDist > 0.02){
            const corrX = cur.x - dx * 0.8, corrY = cur.y - dy * 0.8;
            if (dir){
              const v = DIR_VEC[dir];
              if (v[0] !== 0){
                prev.gridX = v[0] > 0 ? Math.floor(corrX) : Math.ceil(corrX);
                prev.gridY = Math.round(corrY);
                prev.accum = Math.max(0, Math.min(1, (corrX - prev.gridX) * v[0]));
              } else {
                prev.gridX = Math.round(corrX);
                prev.gridY = v[1] > 0 ? Math.floor(corrY) : Math.ceil(corrY);
                prev.accum = Math.max(0, Math.min(1, (corrY - prev.gridY) * v[1]));
              }
            } else {
              prev.gridX = Math.round(corrX); prev.gridY = Math.round(corrY); prev.accum = 0;
            }
          } else {
            prev.gridX = gx; prev.gridY = gy; prev.accum = ac;
          }
        }
      }
    }

    lastServerPos[p.id] = { x: p.x, y: p.y };
  });
  lastPhase = msg.phase;

  {
    const arrivalDt = lastStateArrival != null ? (now - lastStateArrival) : (1000 / 30);
    // Clamp: assorbe il jitter di rete senza mai far percepire un ritardo
    // troppo lungo ne' scatti troppo bruschi se un pacchetto arriva presto.
    snapshotInterpMs = Math.max(28, Math.min(140, arrivalDt));
    lastStateArrival = now;
  }

  // Inizializza o ri-allinea (in modo "morbido") la simulazione locale del
  // proprio personaggio rispetto alla posizione confermata dal server: il
  // server resta l'autorita', il client predice solo per eliminare la
  // latenza percepita. Ora che il server manda la posizione continua reale
  // (non piu' solo la cella), la predizione locale e quella del server
  // dovrebbero coincidere quasi sempre: uno scarto piccolo viene corretto
  // "morbidamente" (senza scatti visibili), uno scarto grande (spawn,
  // respawn, blocco imprevisto) viene corretto subito.
  const myServerP = findPlayer(msg, myId);
  if (myServerP){
    if (!predInited){
      predGridX = Math.round(myServerP.x);
      predGridY = Math.round(myServerP.y);
      predAccum = 0;
      predInited = true;
    } else {
      // IMPORTANTE: l'errore va calcolato tra la posizione CONTINUA
      // predetta (cella + avanzamento frazionario nella direzione corrente)
      // e quella continua del server — non tra la sola cella intera
      // (predGridX) e la posizione continua del server. Confrontare cella
      // intera con posizione frazionaria produceva uno scarto "finto" quasi
      // ad ogni pacchetto (dato che l'avanzamento frazionario e' quasi
      // sempre diverso da zero durante il movimento), facendo scattare la
      // correzione morbida in continuazione: e' questo che causava lo
      // scatto/jitter percepito sul proprio personaggio.
      const curX = predGridX + (predDir ? DIR_VEC[predDir][0] * predAccum : 0);
      const curY = predGridY + (predDir ? DIR_VEC[predDir][1] * predAccum : 0);
      const dx = curX - myServerP.x;
      const dy = curY - myServerP.y;
      const errDist = Math.hypot(dx, dy);
      if (errDist > 0.6 || !myServerP.alive){
        predGridX = Math.round(myServerP.x);
        predGridY = Math.round(myServerP.y);
        predAccum = 0;
      } else if (errDist > 0.02){
        // Piccola correzione morbida (20% dello scarto per tick) invece di
        // uno snap secco: elimina la deriva accumulata nel tempo senza mai
        // farla vedere come un salto. La correzione viene applicata alla
        // posizione continua e poi ri-scomposta in cella+avanzamento.
        const corrX = curX - dx * 0.2;
        const corrY = curY - dy * 0.2;
        if (predDir){
          const v = DIR_VEC[predDir];
          if (v[0] !== 0){
            predGridX = v[0] > 0 ? Math.floor(corrX) : Math.ceil(corrX);
            predAccum = Math.max(0, Math.min(1, (corrX - predGridX) * v[0]));
            predGridY = Math.round(corrY);
          } else {
            predGridY = v[1] > 0 ? Math.floor(corrY) : Math.ceil(corrY);
            predAccum = Math.max(0, Math.min(1, (corrY - predGridY) * v[1]));
            predGridX = Math.round(corrX);
          }
        } else {
          predGridX = Math.round(corrX);
          predGridY = Math.round(corrY);
          predAccum = 0;
        }
      }
    }
  }

  currSnapshot = msg;
  snapshotTime = now;

  updateHud(msg);
  updateGameSidebar(msg);
}

// Eventi puntuali dal server (autorita' unica): pallini, bonus, uccisioni,
// laser, teletrasporti. Ognuno pilota effetto grafico + suono senza dover
// indovinare nulla dallo stato.
function onGameEvent(msg){
  const now = performance.now();
  switch (msg.kind){
    case "pellet": {
      // Uno o piu' pallini mangiati: aggiorna il layer e fa "waka" se sono io.
      let changed = false;
      (msg.cells || []).forEach(function(c){
        const key = c[0] + "," + c[1];
        if (!eatenPellets.has(key)){ eatenPellets.add(key); changed = true; }
      });
      if (changed){
        pelletsLayerDirty = true;
        if (msg.by === myId) playChomp();
      }
      break;
    }
    case "pellet_respawn": {
      // Il pallino mangiato e' ricomparso dopo 20 secondi.
      let changed = false;
      (msg.cells || []).forEach(function(c){
        const key = c[0] + "," + c[1];
        if (eatenPellets.has(key)){ eatenPellets.delete(key); changed = true; }
      });
      if (changed) pelletsLayerDirty = true;
      break;
    }
    case "bonus": {
      const labels = {
        extra_life:   "VITA EXTRA! \u2665",
        laser:        "LASER SBLOCCATO! (1 min)",
        mines:        "MINE SBLOCCATE! (3, tasto 1)",
        ninja:        "NINJA SBLOCCATO! (invisibilit\u00e0, tasto 2)",
        missile:      "MISSILE GUIDATO SBLOCCATO! (tasto 3)",
        trap:         "TRAPPOLA SBLOCCATA! (tasto 4)",
      };
      const txt = labels[msg.bonus] || "BONUS!";
      if (msg.player === myId){
        showBonusBanner(txt);
        playBonus();
      } else {
        const who = findPlayer(currSnapshot, msg.player);
        showToast((who ? who.name : "Un giocatore") + ": " + txt);
      }
      break;
    }
    case "kill": {
      const victim = findPlayer(currSnapshot, msg.victim);
      const at = msg.at || (victim ? [victim.x, victim.y] : [0, 0]);
      const col = (victim && victim.assassin) ? ASSASSIN_COLOR
                : (victim ? (COLOR_HEX[(victim.colors && victim.colors[0])] || "#fff") : "#fff");
      explosions.push({ x: at[0], y: at[1], color: col, start: now });
      playEliminate();
      const byLaser = msg.cause === "laser";
      const byMine = msg.cause === "mine";
      const byAssassin = msg.cause === "assassin";
      const byMissile = msg.cause === "missile";
      const byTrap = msg.cause === "trap";
      const causeTxt = byLaser ? " dal laser" : (byMine ? " da una mina" : (byAssassin ? " da un ninja invisibile"
        : (byMissile ? " da un missile guidato" : (byTrap ? " da una trappola" : ""))));
      const stolenTxt = msg.stolen ? (" (-" + msg.stolen + " punti)") : "";
      if (msg.victim === myId){
        showBonusBanner(msg.respawn ? ("HAI PERSO UNA VITA \u2665" + msg.lives) : "SEI STATO ELIMINATO");
      } else if (victim){
        showToast(victim.name + (msg.respawn ? " colpito!" : " eliminato") + causeTxt + stolenTxt);
      }
      if (msg.stolen && msg.by === myId){
        showToast("Hai rubato " + msg.stolen + " punti!");
      }
      break;
    }
    case "laser_fire": {
      // Nuovo colpo: solo suono, il proiettile in se' viene disegnato ad
      // ogni frame leggendo currSnapshot.lasers (autorita' server).
      playLaser();
      break;
    }
    case "laser_bounce": {
      // Piccola scintilla dove il colpo ha rimbalzato sul muro.
      sparks.push({ x: msg.x, y: msg.y, start: now });
      tone(700, 0.05, "square", 0.09);
      break;
    }
    case "laser_end": {
      sparks.push({ x: msg.x, y: msg.y, start: now });
      break;
    }
    case "mine_place": {
      if (msg.player === myId) showToast("Mina posata (" + msg.left + " rimaste)");
      tone(220, 0.06, "square", 0.1);
      break;
    }
    case "assassin_on": {
      if (msg.player === myId){
        assassinFxAt = now;
        const me = findPlayer(currSnapshot, myId);
        if (me){
          explosions.push({ x: me.x, y: me.y, color: "#ff3232", start: now });
        }
        showBonusBanner("MODALITA' NINJA! INVISIBILE E LETALE");
        playBonus();
      } else {
        // Non si rivela CHI e' diventato ninja: resta invisibile.
        showToast("Un giocatore e' diventato invisibile!");
      }
      break;
    }
    case "assassin_off": {
      if (msg.player === myId) showToast("Modalita' ninja terminata");
      break;
    }
    case "laser_expired": {
      if (msg.player === myId) showToast("Il laser si e' esaurito");
      break;
    }
    case "mine_boom": {
      explosions.push({ x: msg.x, y: msg.y, color: "#ff9d1f", start: now });
      noiseBurst(0.22, 0.18);
      tone(120, 0.2, "sawtooth", 0.14, 0.02);
      break;
    }
    case "missile_fire": {
      if (msg.owner === myId) showToast("Missile lanciato (" + msg.left + " rimasti)");
      tone(180, 0.09, "sawtooth", 0.12);
      break;
    }
    case "missile_end": {
      explosions.push({ x: msg.x, y: msg.y, color: "#8fd3ff", start: now });
      tone(140, 0.15, "sawtooth", 0.12, 0.02);
      break;
    }
    case "kill_life_bonus": {
      if (msg.player === myId){
        showBonusBanner("VITA EXTRA! (" + msg.kills + " uccisioni) \u2665" + msg.lives);
        playBonus();
      }
      break;
    }
    case "trap_start": {
      if (msg.player === myId){
        showBonusBanner("NEMICO INTRAPPOLATO! Avvicinati e premi 3");
        playBonus();
      } else if (msg.victim === myId){
        showBonusBanner("SEI INTRAPPOLATO!");
      }
      tone(300, 0.12, "square", 0.1);
      break;
    }
    case "trap_expired": {
      if (msg.player === myId) showToast("La trappola si e' disinnescata");
      break;
    }
    case "trap_boom": {
      explosions.push({ x: msg.x, y: msg.y, color: "#ffd166", start: now });
      noiseBurst(0.18, 0.16);
      tone(160, 0.18, "sawtooth", 0.13, 0.02);
      break;
    }
    case "teleport": {
      const col = mazeTheme.glow || "#9df6ff";
      swirls.push({ x: msg.from[0], y: msg.from[1], start: now, color: col });
      swirls.push({ x: msg.to[0],   y: msg.to[1],   start: now, color: col });
      playTeleport();
      // Se sono io a teletrasportarmi, aggancio subito la predizione locale
      // alla cella di arrivo per non "scivolare" verso il portale vecchio.
      if (msg.player === myId){
        predGridX = msg.to[0]; predGridY = msg.to[1]; predAccum = 0;
      }
      break;
    }
  }
}

function showBonusBanner(text){
  // Durata fissata a 1 secondo (richiesta esplicita): il messaggio che
  // annuncia il bonus appena sbloccato resta a schermo esattamente 1000ms.
  const el = document.getElementById("bonusBanner");
  if (!el) return;
  el.textContent = text;
  el.classList.add("show");
  bonusBannerUntil = performance.now() + 1000;
  clearTimeout(showBonusBanner._t);
  showBonusBanner._t = setTimeout(function(){ el.classList.remove("show"); }, 1000);
}

function updateHud(msg){
  const timerEl = document.getElementById("hudTimer");
  if (msg.phase === "countdown"){
    timerEl.textContent = "IL ROUND INIZIA TRA " + Math.ceil(msg.countdown) + "s (puoi gia' muoverti)";
    timerEl.classList.remove("urgent");
  } else {
    timerEl.textContent = "TEMPO: " + Math.ceil(msg.timer) + "s";
    timerEl.classList.toggle("urgent", msg.timer <= 10);
  }
  updateScoreCounter(msg);
}

// Contatore punti dedicato (vedi .score-counter in alto a sinistra):
// prima il punteggio era scritto in coda alla stringa del timer, che cambia
// ogni tick ed e' lunga (fase, secondi...): il numero dei
// punti finiva "perso" in mezzo al testo e passava inosservato. Ora ha un
// box tutto suo, sempre nello stesso posto: i TUOI punti in evidenza sopra,
// e sotto una mini-classifica con i punti di TUTTI gli altri giocatori.
let scoreOthersSig = "";
function updateScoreCounter(msg){
  const myLine = document.getElementById("myScoreLine");
  const nextEl = document.getElementById("scoreNextBonus");
  const othersEl = document.getElementById("scoreOthers");
  if (!myLine || !nextEl || !othersEl) return;

  const me = findPlayer(msg, myId);
  const pts = me ? (me.points || 0) : 0;
  const lives = me ? (me.lives || 1) : 1;
  myLine.textContent = "PUNTI " + pts + " · \u2665" + lives + (me && me.assassin ? " · ASSASSINO" : "");
  const next = BONUS_STEPS.find(function(s){ return pts < s.at; });
  nextEl.textContent = next
    ? ("prossimo bonus: " + next.label + " a " + next.at + " pt (mancano " + (next.at - pts) + ")")
    : "tutti i bonus sbloccati";

  // Classifica degli altri giocatori, ordinata per punti decrescenti.
  const others = (msg.players || [])
    .filter(function(p){ return p.id !== myId; })
    .sort(function(a, b){ return (b.points || 0) - (a.points || 0); });

  const sig = others.map(function(p){ return p.id + ":" + p.name + ":" + (p.colors||[]).join(","); }).join("|");
  if (sig !== scoreOthersSig){
    scoreOthersSig = sig;
    othersEl.innerHTML = "";
    others.forEach(function(p){
      const row = document.createElement("div");
      row.className = "score-row";
      const sw = document.createElement("span");
      sw.className = "sw";
      const c = COLOR_HEX[(p.colors || [])[0]] || "#888";
      sw.style.background = c;
      row.appendChild(sw);
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = p.name;
      row.appendChild(nm);
      const pt = document.createElement("span");
      pt.className = "pt";
      row.appendChild(pt);
      othersEl.appendChild(row);
      row._ptEl = pt;
      row._id = p.id;
    });
  }
  Array.from(othersEl.children).forEach(function(row){
    const p = others.find(function(o){ return o.id === row._id; });
    if (p && row._ptEl) row._ptEl.textContent = (p.points || 0) + "p";
  });
}

let lastSidebarSig = "";
let sidebarRefs = {};   // id -> {score, tags} per aggiornare punti/vite senza rebuild
function updateGameSidebar(msg){
  // La struttura della lista (chi c'e', vivo/morto, fantasma, laser) cambia
  // di rado: si ricostruisce il DOM solo su questi cambi (signature). Punti
  // e vite invece cambiano spesso: si aggiornano scrivendo direttamente
  // nello <span> gia' esistente, senza ricostruire nulla (perf).
  const sig = myId + "|" + msg.players.map(function(p){
    return p.id + ":" + p.alive + ":" + p.name +
           ":" + (p.colors || []).join(",") + ":" + (p.laser ? "l" : "") +
           (p.bounce ? "b" : "") + (p.mines ? ("m" + p.mines_left) : "") +
           (p.missile ? ("r" + p.missiles_left) : "") +
           (p.ninja && p.id === myId ? "N" : "") +
           (p.trapped ? "t" : "") +
           ((p.assassin && p.id === myId) ? "A" : "");
  }).join("|");

  if (sig !== lastSidebarSig){
    lastSidebarSig = sig;
    sidebarRefs = {};
    const list = document.getElementById("gamePlayers");
    list.innerHTML = "";
    msg.players.forEach(function(p){
      const li = document.createElement("li");
      const iAmAssassinRow = p.assassin && p.id === myId;
      li.className = "player-row" + (!p.alive ? " dead" : "");
      const sw = document.createElement("span");
      sw.className = "swatch";
      const colors = p.colors || [];
      const c = iAmAssassinRow ? ASSASSIN_COLOR : (COLOR_HEX[colors[0]] || "#888");
      sw.style.background = c; sw.style.color = c;
      if (!iAmAssassinRow && colors[1]){
        sw.style.boxShadow = "0 0 0 2px " + COLOR_HEX[colors[1]] + ", 0 0 6px currentColor";
      }
      li.appendChild(sw);
      const nameSpan = document.createElement("span");
      nameSpan.textContent = p.name;
      li.appendChild(nameSpan);
      if (p.id === myId){ const t = document.createElement("span"); t.className="tag you"; t.textContent="TU"; li.appendChild(t); }
      if (p.laser){ const t = document.createElement("span"); t.className="tag alert"; t.textContent="LASER"; li.appendChild(t); }
      if (p.bounce){ const t = document.createElement("span"); t.className="tag alert"; t.textContent="RIMBALZO"; li.appendChild(t); }
      if (p.mines){ const t = document.createElement("span"); t.className="tag alert"; t.textContent="MINE " + p.mines_left; li.appendChild(t); }
      if (p.missile){ const t = document.createElement("span"); t.className="tag alert"; t.textContent="MISSILI " + p.missiles_left; li.appendChild(t); }
      if (p.ninja && p.id === myId && !iAmAssassinRow){ const t = document.createElement("span"); t.className="tag alert"; t.textContent="NINJA (2)"; li.appendChild(t); }
      if (p.trapped){ const t = document.createElement("span"); t.className="tag alert"; t.textContent="INTRAPPOLATO"; li.appendChild(t); }
      if (iAmAssassinRow){ const t = document.createElement("span"); t.className="tag alert"; t.textContent="ASSASSINO"; li.appendChild(t); }
      const spacer = document.createElement("span"); spacer.className = "spacer"; li.appendChild(spacer);
      const score = document.createElement("span");
      score.style.fontSize = "10px"; score.style.color = "var(--phosphor-dim)";
      li.appendChild(score);
      list.appendChild(li);
      sidebarRefs[p.id] = score;
    });
  }

  // aggiornamento leggero di punti/vite
  msg.players.forEach(function(p){
    const el = sidebarRefs[p.id];
    if (el) el.textContent = (p.points || 0) + "p · \u2665" + (p.lives || 1);
  });
}

function onRoundEnd(msg){
  roundActive = false;
  stopSiren();
  const iWon = msg.winners.indexOf(myId) !== -1;
  if (iWon) playVictory(); else playGameOver();

  const overlay = document.getElementById("endOverlay");
  const title = document.getElementById("endTitle");
  const winners = document.getElementById("endWinners");
  if (msg.reason === "last_survivor") title.textContent = "ULTIMO SOPRAVVISSUTO!";
  else if (msg.reason === "time_up") title.textContent = "TEMPO SCADUTO";
  else title.textContent = "FINE ROUND";

  winners.innerHTML = "";
  msg.winners.forEach(function(wid){
    const div = document.createElement("div");
    const isMe = wid === myId;
    div.innerHTML = (isMe ? "<b>" : "") + (msg.names[wid] || wid) + (isMe ? " (TU!)</b>" : "");
    winners.appendChild(div);
  });

  // Classifica punti (dal messaggio round_end.scores), ordine decrescente.
  const scoresEl = document.getElementById("endScores");
  scoresEl.innerHTML = "";
  if (msg.scores){
    const rows = Object.keys(msg.scores).map(function(id){
      return { id: id, name: (msg.names && msg.names[id]) || id, pts: msg.scores[id] };
    }).sort(function(a, b){ return b.pts - a.pts; });
    rows.forEach(function(r, i){
      const div = document.createElement("div");
      div.className = (r.id === myId) ? "me" : "";
      div.innerHTML = '<span class="rank">' + (i + 1) + '.</span> ' + r.name + " — " + r.pts + " punti";
      scoresEl.appendChild(div);
    });
  }
  overlay.classList.remove("hidden");
}

/* =========================================================================
   INPUT: TASTIERA + D-PAD TOUCH
   Movimento "vero" alla Pac-Man: il personaggio e' SEMPRE in movimento da
   solo (lato server, vedi update_movement in main.py: la direzione resta
   impostata finche' non la si cambia o non si sbatte contro un muro).
   Il tasto/pulsante NON avvia e non ferma il movimento: serve solo a
   indicare la PROSSIMA direzione desiderata, che scatta subito se libera o
   appena lo diventa (coda next_direction, sia server che predizione
   client). Non si invia piu' alcun "stop" al rilascio: e' proprio quello
   stop-and-go tra un tasto e l'altro a causare il "lag" percepito nei
   cambi di direzione. Rilasciare un tasto quindi non fa piu' nulla: si
   continua a muoversi finche' non si preme una direzione diversa (o si
   sbatte contro un muro, esattamente come nel gioco originale).
   ========================================================================= */
const KEY_TO_DIR = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
  W: "up", S: "down", A: "left", D: "right",
};

let lastRequestedDir = null;

// Finestra di tolleranza per il tempismo della svolta: DEVE restare
// identica a TURN_WINDOW in common.py, altrimenti client e server
// "decidono" cose diverse sulla stessa pressione e si torna al problema
// del teletrasporto da correzione. Il tasto prende solo se premuto vicino
// al centro cella (predAccum vicino a 0.0 o vicino a 1.0): altrimenti
// viene scartato subito, invece di restare in coda a sovrapporsi al
// prossimo comando.
const TURN_WINDOW = 0.22;

function requestDir(dir){
  // Da fermi, o se si conferma la direzione gia' in corso, il tempismo
  // non conta: si accetta sempre (altrimenti non si potrebbe nemmeno
  // partire dallo spawn, e "andare dritti" non e' mai una svolta).
  const onTime = (predAccum <= TURN_WINDOW) || (predAccum >= 1 - TURN_WINDOW);
  if (predDir !== null && dir !== predDir && !onTime){
    // Fuori tempo rispetto alla curva: ignorato. Niente coda, niente
    // suono di svolta, niente invio al server: bisogna ripremere il
    // tasto un po' piu' vicino all'incrocio.
    return;
  }
  if (dir !== lastRequestedDir){ playTurn(); lastRequestedDir = dir; }
  predNextDir = dir;
  sendMsg({ type: "move", direction: dir });
}

// Bonus 200 punti: il tasto "1" sgancia una mina nella cella corrente.
// Il server e' l'autorita' su quante mine restano e ignora la richiesta
// se il bonus non e' ancora sbloccato o non ci sono piu' mine disponibili.
document.addEventListener("keydown", function(ev){
  if (currentScreen !== "game") return;
  const dir = KEY_TO_DIR[ev.key];
  if (dir){
    if (!ev.repeat) requestDir(dir);
    ev.preventDefault();
    return;
  }
  if (ev.key === "1" && !ev.repeat){
    sendMsg({ type: "place_mine" });
    ev.preventDefault();
  }
  // Bonus 300 punti: il tasto "2" attiva la modalita' ninja (invisibilita'
  // + velocita' + uccisione al contatto) per 30 secondi. Si puo' riattivare
  // piu' volte nello stesso round, ma solo quando non e' gia' attiva.
  if (ev.key === "2" && !ev.repeat){
    sendMsg({ type: "activate_ninja" });
    ev.preventDefault();
  }
  // Bonus 400 punti: il tasto "3" spara l'unico missile guidato disponibile
  // verso il nemico piu' vicino.
  if (ev.key === "3" && !ev.repeat){
    sendMsg({ type: "fire_missile" });
    ev.preventDefault();
  }
  // Bonus 500 punti: il tasto "4" gestisce tutta la trappola. Se non c'e'
  // ancora nessuno intrappolato, intrappola il nemico piu' vicino. Se c'e'
  // gia' una vittima intrappolata ed e' abbastanza vicina, la fa detonare.
  if (ev.key === "4" && !ev.repeat){
    sendMsg({ type: "activate_trap" });
    ev.preventDefault();
  }
});
// keyup: non fa piu' nulla di apposta. Il personaggio continua a muoversi
// da solo nella direzione corrente, come nel Pac-Man originale.

// D-pad touch rimosso su richiesta (le frecce sotto lo schermo davano
// fastidio): il movimento resta disponibile da tastiera (WASD/frecce).
// NB: su mobile senza tastiera fisica il gioco non e' piu' controllabile
// da touch — se serve, si puo' reintrodurre uno swipe-gesture sul canvas.

})();
</script>
