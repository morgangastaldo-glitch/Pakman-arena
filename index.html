<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pac-Man Arena 1vAll</title>
<style>
  :root{
    /* ---- design tokens ----
       Cornice UI: terminale hacker fosforescente (coerente col resto dei
       progetti). Il MONDO di gioco (mappa/personaggi) usa invece la
       palette arcade classica, perche' e' quello che rende "veri" i
       personaggi Pac-Man. Il contrasto tra le due e' voluto: un cabinato
       arcade che gira dentro un terminale verde.
    */
    --bg: #030305;
    --panel: #070a08;
    --panel-edge: #0e2a18;
    --phosphor: #35ff8d;
    --phosphor-dim: #14a85c;
    --phosphor-faint: rgba(53,255,141,0.35);
    --marquee-yellow: #ffd400;
    --marquee-yellow-glow: #fff4b8;
    --wall-fill: #0a1440;
    --wall-edge: #2b4bd6;
    --wall-glow: #4d7bff;
    --pellet: #ffe9a8;
    --alert: #ff2b4e;
    --c-azzurro: #29d6ff;
    --c-giallo: #ffd400;
    --c-verde: #33ff77;
    --c-bianco: #f5f5f5;
    --c-rosa: #ff5fd1;
    --danger: #ff4d5e;
    --mono: ui-monospace, "SFMono-Regular", "Courier New", Consolas, monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% 0%, #061006 0%, var(--bg) 60%);
    color: var(--phosphor);
    font-family: var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding: 14px;
    overflow-x:hidden;
  }

  /* ---------- CRT overlay ---------- */
  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 2px, transparent 3px),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
    opacity:0.55;
  }
  @keyframes flicker{
    0%,100%{ opacity:0.55; } 48%{ opacity:0.55; } 50%{ opacity:0.44; } 52%{ opacity:0.55; }
  }
  @media (prefers-reduced-motion: no-preference){
    .crt{ animation: flicker 6.5s infinite; }
  }

  /* ---------- cabinet frame ---------- */
  .cabinet{
    position:relative;
    width:min(640px, 100%);
    transition: width 0.15s ease;
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    background: linear-gradient(180deg, #08110b, #050705);
    box-shadow:
      0 0 0 1px rgba(53,255,141,0.08),
      0 0 40px rgba(53,255,141,0.08),
      inset 0 0 60px rgba(0,0,0,0.6);
    padding: 18px;
  }
  .cabinet::before{
    content:"PAC-MAN ARENA :: 1vALL TERMINAL";
    display:block;
    font-size:10px;
    letter-spacing:2px;
    color: var(--phosphor-dim);
    margin-bottom:10px;
    opacity:0.8;
  }

  .hidden{ display:none !important; }

  h1,h2,h3{ margin:0; font-family:var(--mono); }

  .glow-text{ text-shadow: 0 0 6px var(--phosphor-faint), 0 0 14px var(--phosphor-faint); }

  label{
    display:block; font-size:11px; letter-spacing:1.5px; color:var(--phosphor-dim);
    margin-bottom:4px; text-transform:uppercase;
  }
  input[type=text], input[type=number]{
    width:100%;
    background: #010402;
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor);
    font-family:var(--mono);
    font-size:15px;
    padding: 9px 10px;
    border-radius: 4px;
    outline:none;
  }
  input:focus-visible, button:focus-visible{
    outline: 2px solid var(--marquee-yellow);
    outline-offset: 2px;
  }
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:10px; }
  .row > .field{ flex:1; }

  button{
    font-family:var(--mono);
    cursor:pointer;
    border-radius: 5px;
    border: 1px solid var(--phosphor-dim);
    background: #04140a;
    color: var(--phosphor);
    letter-spacing: 1.5px;
    text-transform:uppercase;
    font-size:12.5px;
    padding: 11px 14px;
    transition: transform 0.05s ease, box-shadow 0.15s ease;
  }
  button:hover{ box-shadow: 0 0 12px var(--phosphor-faint); }
  button:active{ transform: scale(0.97); }
  button.primary{
    background: var(--phosphor-dim);
    color:#04140a;
    border-color: var(--phosphor);
    font-weight:bold;
  }
  button.primary:hover{ box-shadow: 0 0 16px var(--phosphor); }
  button.ghost{ background:transparent; }
  button.danger{ border-color:var(--danger); color:var(--danger); }
  button:disabled{ opacity:0.35; cursor:not-allowed; }
  button.tab{ flex:1; }
  button.tab.active{ background:var(--phosphor-dim); color:#04140a; }

  .btn-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

  /* ---------- title / logo ---------- */
  .title-wrap{ text-align:center; margin-bottom:18px; }
  .title-wrap h1{
    font-size: clamp(22px, 6vw, 32px);
    color: var(--marquee-yellow);
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--marquee-yellow-glow), 0 0 22px rgba(255,212,0,0.5);
  }
  .title-wrap .sub{
    font-size:11px; letter-spacing:4px; color:var(--phosphor-dim); margin-top:4px;
  }
  .logo-canvas{ display:block; margin: 4px auto 10px; }

  .error-box{
    margin-top:10px; font-size:12px; color:var(--danger);
    border-left:2px solid var(--danger); padding-left:8px; min-height:1em;
  }

  /* ---------- lobby ---------- */
  .room-code{
    font-size: clamp(28px,7vw,38px); letter-spacing:6px; color:var(--marquee-yellow);
    text-shadow:0 0 10px rgba(255,212,0,0.5);
    text-align:center; margin: 6px 0 2px;
  }
  .room-code-label{ text-align:center; font-size:10px; letter-spacing:2px; color:var(--phosphor-dim); }
  .player-list{ list-style:none; margin:14px 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .player-row{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--panel-edge); border-radius:5px; padding:7px 10px;
    font-size:13px; background:rgba(53,255,141,0.03);
  }
  .player-row.dead{ opacity:0.4; text-decoration: line-through; }
  .swatch{ width:13px; height:13px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 6px currentColor; }
  .tag{ font-size:10px; padding:1px 5px; border-radius:3px; letter-spacing:1px; }
  .tag.host{ background:var(--marquee-yellow); color:#221900; }
  .tag.you{ border:1px solid var(--phosphor-dim); color:var(--phosphor-dim); }
  .tag.alert{ background:var(--alert); color:#2a0007; }
  .spacer{ flex:1; }

  .color-grid{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .color-swatch-btn{
    width:44px; height:44px; border-radius:50%; border:2px solid transparent; cursor:pointer;
    position:relative;
  }
  .color-swatch-btn[data-taken="1"]{ opacity:0.25; cursor:not-allowed; }
  .color-swatch-btn[data-mine="1"]{ border-color:#fff; box-shadow:0 0 12px currentColor; }

  .char-grid{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .char-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:66px; padding:6px 4px; background:#04140a;
  }
  .char-btn canvas{ display:block; }
  .char-btn-label{ font-size:9px; letter-spacing:0.5px; line-height:1.15; text-align:center; }
  .char-btn.active{ border-color:var(--marquee-yellow); box-shadow:0 0 10px rgba(255,212,0,0.4); }

  /* ---------- game screen ---------- */
  .hud{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; margin-bottom:8px; letter-spacing:1px;
  }
  .hud .timer{ color:var(--phosphor); }
  .hud .timer.urgent{ color:var(--danger); text-shadow:0 0 8px var(--danger); }
  .hud .roomtag{ color:var(--phosphor-dim); font-size:11px; }

  /* ---- contatore punti: prima era "nascosto" dentro la stringa lunga del
     timer (che cambia ogni tick ed e' facile perdere in mezzo al resto del
     testo). Ora e' un blocco proprio, sempre visibile, in alto a sinistra
     sul canvas: mostra i TUOI punti in evidenza e sotto una mini-classifica
     con i punti di tutti gli altri giocatori. ---- */
  .score-counter{
    position:absolute; top:8px; left:8px; z-index:6;
    background:rgba(2,6,3,0.72); border:1px solid var(--panel-edge);
    border-radius:8px; padding:6px 10px; backdrop-filter: blur(2px);
    letter-spacing:0.5px; min-width:120px;
    pointer-events:none;
  }
  .score-counter .my-score{
    font-size:16px; font-weight:bold; white-space:nowrap;
    color:var(--marquee-yellow); text-shadow:0 0 8px rgba(255,212,0,0.35);
  }
  .score-counter .next-bonus{
    display:block; margin-top:1px; font-size:10px; font-weight:normal;
    letter-spacing:0.5px; color:var(--phosphor-dim);
  }
  .score-counter .score-others{
    margin-top:5px; padding-top:5px; border-top:1px solid var(--panel-edge);
    display:flex; flex-direction:column; gap:2px;
  }
  .score-counter .score-row{
    display:flex; align-items:center; gap:6px; font-size:10.5px;
    color:var(--phosphor-dim); white-space:nowrap;
  }
  .score-counter .score-row .sw{
    width:8px; height:8px; border-radius:50%; flex:0 0 auto;
  }
  .score-counter .score-row .nm{ overflow:hidden; text-overflow:ellipsis; max-width:80px; }
  .score-counter .score-row .pt{ margin-left:auto; }


  .game-area{ display:flex; min-width:0; min-height:0; }
  .canvas-wrap{
    position:relative; flex:1 1 auto; min-width:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px; overflow:hidden;
    border:1px solid var(--wall-edge);
    box-shadow:0 0 18px rgba(45,75,255,0.25) inset;
    background:#000;
  }
  canvas{ display:block; max-width:100%; max-height:100%; height:auto; }

  /* La sidebar giocatori e' un pannello sovrapposto alla mappa (non ruba
     piu' spazio orizzontale al canvas): cosi' la mappa puo' occupare
     davvero tutto lo schermo, in verticale come in orizzontale. */
  .sidebar{
    position:absolute; top:8px; right:8px; z-index:6;
    display:flex; flex-direction:column; gap:4px;
    max-width:38%; max-height:70%; overflow-y:auto;
    background:rgba(2,6,3,0.62); border:1px solid var(--panel-edge);
    border-radius:8px; padding:6px; backdrop-filter: blur(2px);
  }
  .sidebar .player-row{ font-size:10.5px; padding:4px 6px; white-space:nowrap; }

  .bonus-banner{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) scale(0.9);
    background:rgba(30,22,0,0.85); border:1px solid var(--marquee-yellow);
    color:var(--marquee-yellow);
    padding:8px 18px; border-radius:6px; font-size:16px; letter-spacing:2px;
    font-weight:bold; text-shadow:0 0 10px rgba(255,212,0,0.6);
    opacity:0; transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none; white-space:nowrap; z-index:7;
  }
  .bonus-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  .end-overlay{
    position:absolute; inset:0; background:rgba(2,3,2,0.86);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:20px;
  }
  .end-overlay h2{ color:var(--marquee-yellow); letter-spacing:2px; text-shadow:0 0 10px rgba(255,212,0,0.5); }
  .end-overlay .winners{ font-size:14px; }
  .end-overlay .winners b{ color:var(--phosphor); }
  .end-overlay .note{ font-size:11px; color:var(--phosphor-dim); margin-top:6px; }
  .end-scores{ font-size:12px; color:var(--phosphor); margin-top:4px; line-height:1.6; }
  .end-scores .me{ color:var(--marquee-yellow); font-weight:bold; }
  .end-scores .rank{ color:var(--phosphor-dim); }

  .toast{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.75); border:1px solid var(--phosphor-dim); color:var(--phosphor);
    padding:5px 12px; border-radius:5px; font-size:11px; opacity:0; transition:opacity 0.4s ease;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  /* ---------- controlli ---------- */
  .controls-row{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px; flex-wrap:wrap; }
  .hint{ font-size:10.5px; color:var(--phosphor-dim); }

  .cabinet.wide{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* segue la UI dinamica del browser mobile: niente barre che tagliano la mappa */
    max-width: none;
    border-radius: 0;
    padding: 10px;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
    display: flex;
    flex-direction: column;
    z-index: 40;
  }
  .cabinet.wide::before{ display:none; }
  body.game-fullscreen{ padding:0; }
  .cabinet.wide #screen-game{
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .cabinet.wide .game-area{ flex:1; min-height:0; min-width:0; }
  .cabinet.wide .canvas-wrap{ flex:1; min-height:0; min-width:0; width:100%; height:100%; }
  .cabinet.wide .hud{ flex:0 0 auto; }
  .cabinet.wide .controls-row{ flex:0 0 auto; }

  @media (max-width:480px){
    .cabinet{ padding:12px; }
    .sidebar{ max-width:56%; font-size:10px; }
  }
</style>
</head>
<body>

<div class="crt" aria-hidden="true"></div>

<main class="cabinet">

  <!-- ===================== SCHERMATA: CONNESSIONE ===================== -->
  <section id="screen-connect" class="screen">
    <div class="title-wrap">
      <canvas id="logoCanvas" class="logo-canvas" width="160" height="60"></canvas>
      <h1>PAC-MAN ARENA</h1>
      <div class="sub">1 vs ALL &mdash; fino a 5 giocatori</div>
    </div>

    <div class="field">
      <label for="inpName">Il tuo nome</label>
      <input type="text" id="inpName" maxlength="16" placeholder="Player">
    </div>
    <div class="row">
      <div class="field">
        <label for="inpIp">IP del server</label>
        <input type="text" id="inpIp" placeholder="127.0.0.1">
      </div>
      <div class="field" style="flex:0 0 100px">
        <label for="inpPort">Porta</label>
        <input type="text" id="inpPort" placeholder="8765">
      </div>
    </div>

    <div class="btn-row">
      <button class="tab active" id="tabCreate">Crea stanza</button>
      <button class="tab" id="tabJoin">Unisciti</button>
    </div>

    <div class="field hidden" id="joinCodeField" style="margin-top:10px">
      <label for="inpCode">Codice stanza</label>
      <input type="text" id="inpCode" maxlength="6" placeholder="ABC123" style="text-transform:uppercase">
    </div>

    <div class="btn-row">
      <button class="primary" id="btnConnect" style="flex:1">Entra in partita</button>
    </div>
    <div class="error-box" id="connectError"></div>
  </section>

  <!-- ===================== SCHERMATA: LOBBY ===================== -->
  <section id="screen-lobby" class="screen hidden">
    <div class="room-code-label">codice stanza</div>
    <div class="room-code" id="lobbyCode">------</div>

    <ul class="player-list" id="lobbyPlayers"></ul>

    <label>Scegli colore (primario + dettaglio opzionale)</label>
    <div class="color-grid" id="colorGrid"></div>

    <label>Scegli personaggio</label>
    <div class="char-grid" id="characterGrid"></div>

    <div class="btn-row">
      <button class="primary hidden" id="btnStart" style="flex:1">Avvia partita</button>
      <span id="waitHostMsg" class="hint hidden">In attesa che l'host avvii la partita&hellip;</span>
      <button class="ghost danger" id="btnLeaveLobby">Esci</button>
    </div>
    <div class="error-box" id="lobbyError"></div>
  </section>

  <!-- ===================== SCHERMATA: GIOCO ===================== -->
  <section id="screen-game" class="screen hidden">
    <div class="hud">
      <span class="timer" id="hudTimer">--</span>
      <span class="roomtag" id="hudMap"></span>
      <span class="roomtag" id="hudRoom"></span>
    </div>

    <div class="game-area">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas"></canvas>
        <ul class="sidebar player-list" id="gamePlayers"></ul>
        <div class="score-counter" id="scoreCounter">
          <span class="my-score" id="myScoreLine">PUNTI 0</span>
          <span class="next-bonus" id="scoreNextBonus"></span>
          <div class="score-others" id="scoreOthers"></div>
        </div>
        <div class="bonus-banner" id="bonusBanner"></div>
        <div class="toast" id="toast"></div>

        <div class="end-overlay hidden" id="endOverlay">
          <h2 id="endTitle">FINE ROUND</h2>
          <div class="winners" id="endWinners"></div>
          <div class="end-scores" id="endScores"></div>
          <div class="note">si torna in lobby tra pochi secondi&hellip;</div>
        </div>
      </div>
    </div>

    <div class="controls-row">
      <span class="hint">WASD / frecce tastiera · Pallini = punti · Bonus a 50/100/150/200/300 · Tasto 1 = mina</span>
      <button class="ghost danger" id="btnLeaveGame">Esci</button>
    </div>
  </section>

</main>

<script>
(function(){
"use strict";

/* =========================================================================
   COSTANTI CONDIVISE COL SERVER (vedi common.py)
   ========================================================================= */
const SERVER_TICK_HZ = 60; // deve restare identico a TICK_HZ in common.py
const SERVER_TICK_MS = 1000 / SERVER_TICK_HZ;
const BASE_CELL = 24; // risoluzione interna del canvas, in px per cella

// Devono restare identiche a NORMAL_SPEED / ASSASSIN_SPEED_MULT in common.py:
// servono per calcolare quanto deve durare, in millisecondi, lo scivolamento
// visivo di una pedina da una cella alla successiva. Cosi' l'animazione e'
// fluida per costruzione e non dipende piu' da quanto arrivano puntuali gli
// aggiornamenti di rete dal server.
const NORMAL_SPEED = 4.5;
const ASSASSIN_SPEED_MULT = 1.1;  // il super assassino e' 1.1x rispetto a 1.0 dei giocatori normali
const SUPER_ASSASSIN_THRESHOLD = 300; // deve restare identica a SUPER_ASSASSIN_THRESHOLD in common.py
// Soglie dei bonus, per l'indicazione "prossimo bonus" nell'HUD: devono
// restare identiche a BONUS_THRESHOLDS in common.py.
const BONUS_STEPS = [
  { at: 50,  label: "VITA EXTRA" },
  { at: 100, label: "SECONDA VITA EXTRA" },
  { at: 150, label: "LASER (1 min)" },
  { at: 200, label: "MINE (tasto 1)" },
  { at: 300, label: "NINJA / INVISIBILITA' (tasto 2)" },
  { at: 400, label: "MISSILE GUIDATO (tasto 3)" },
  { at: 500, label: "TRAPPOLA (tasto 4)" },
];
const MISSILE_SPEED_MULT = 1.1; // deve restare identica a MISSILE_SPEED_MULT in common.py
const TRAP_DURATION_SECONDS = 15; // deve restare identica a TRAP_DURATION_SECONDS in common.py
function cellDurationMs(isAssassin){
  const speed = NORMAL_SPEED * (isAssassin ? ASSASSIN_SPEED_MULT : 1);
  return 1000 / speed;
}

// Deve restare in sincronia con COLORS in common.py.
const COLOR_HEX = {
  azzurro:    "#29d6ff",
  giallo:     "#ffd400",
  verde:      "#33ff77",
  bianco:     "#f5f5f5",
  rosa:       "#ff5fd1",
  arancione:  "#ff9d1f",
  rosso:      "#ff4136",
  viola:      "#9b3bff",
  lime:       "#c6ff3f",
  oro:        "#ffcf40",
  ciano:      "#22e6ff",
  magenta:    "#ff2b9e",
  grigio:     "#c7d0d8",
  marrone:    "#b5651d",
  blu_notte:  "#5b6bff",
  corallo:    "#ff5a36",
};
const ASSASSIN_COLOR = "#ff2b4e";
const COLOR_NAMES = Object.keys(COLOR_HEX);
const DIR_ANGLE = { right: 0, down: 90, left: 180, up: 270 };
// Deve restare identico a DIRECTIONS in common.py: usato dalla simulazione
// locale (client-side prediction) per muovere SUBITO il proprio personaggio
// alla pressione di un tasto, senza aspettare il giro di rete col server.
const DIR_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// Personaggi selezionabili: id -> etichetta mostrata in lobby. La forma di
// ognuno viene disegnata da drawPacmanVariant() piu' sotto. Deve restare in
// sincronia con CHARACTERS in common.py.
const CHARACTERS = [
  { id: "classic", label: "Classico" },
  { id: "shark",   label: "Denti da squalo" },
  { id: "hex",     label: "Esagonale" },
  { id: "cyclops", label: "Occhio ciclope" },
  { id: "angry",   label: "Occhio arrabbiato" },
];

// Tema visivo della mappa corrente (muri/pellet/sfondo): il server ne sceglie
// uno diverso tra 10 ad ogni inizio partita (vedi round_start), cosi' ogni
// mappa ha davvero una sua identita' cromatica e non solo una forma diversa.
let mazeTheme = { wall: "#0a1440", edge: "#2b4bd6", glow: "#4d7bff", pellet: "#ffe9a8", bg: "#000000" };
let mazeName = "";

// Ogni mappa ha ora una VERA identita' visiva basata sul suo tema (punto 5
// delle richieste): i gruppi di muri connessi vengono colorati "a chiazze"
// come prima, ma con VARIANTI del tema della mappa (base, schiarita,
// accentata) invece che con colori casuali scollegati. Cosi' "Lava Cremisi"
// e' davvero tutta lava, "Ghiaccio Ciano" tutta ghiaccio, e cosi' via -
// mantenendo comunque profondita' e varieta' tra le zone del labirinto.
let themeWallVariants = [];

function makeThemeVariants(theme){
  const base = { wall: theme.wall, edge: theme.edge, glow: theme.glow };
  return [
    base,
    { wall: lightenHex(theme.wall, 0.10), edge: lightenHex(theme.edge, 0.14), glow: lightenHex(theme.glow, 0.12) },
    { wall: lightenHex(theme.wall, 0.20), edge: theme.glow, glow: lightenHex(theme.glow, 0.25) },
    { wall: mixHex(theme.wall, theme.bg || "#000000", 0.35), edge: lightenHex(theme.edge, 0.05), glow: theme.glow },
  ];
}

// Miscela due colori esadecimali (t=0 -> a, t=1 -> b): usato per la
// variante "scura" dei muri, tirata verso lo sfondo del tema.
function mixHex(a, b, t){
  const pa = a.replace("#", ""), pb = b.replace("#", "");
  if (pa.length !== 6 || pb.length !== 6) return a;
  const ch = function(i){
    const va = parseInt(pa.slice(i, i + 2), 16);
    const vb = parseInt(pb.slice(i, i + 2), 16);
    return Math.round(va + (vb - va) * t);
  };
  return "rgb(" + ch(0) + "," + ch(2) + "," + ch(4) + ")";
}

// Mappa "x,y" -> indice variante, ricalcolata ad ogni nuova mappa (vedi
// applyMapData). Colora ogni GRUPPO di celle-muro connesse con una delle
// varianti del tema corrente.
let wallColorByCell = {};

function computeWallColors(){
  wallColorByCell = {};
  themeWallVariants = makeThemeVariants(mazeTheme);
  const visited = new Set();
  let lastIdx = -1;
  for (let y = 0; y < mazeH; y++){
    for (let x = 0; x < mazeW; x++){
      const key = x + "," + y;
      if (maze[y][x] !== "#" || visited.has(key)) continue;
      // BFS sulla regione di muri 4-connessa a partire da qui.
      let idx;
      do { idx = Math.floor(Math.random() * themeWallVariants.length); }
      while (themeWallVariants.length > 1 && idx === lastIdx);
      lastIdx = idx;
      const stack = [[x, y]];
      visited.add(key);
      while (stack.length){
        const [cx, cy] = stack.pop();
        wallColorByCell[cx + "," + cy] = idx;
        const neighbors = [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
        for (const [nx, ny] of neighbors){
          if (nx < 0 || ny < 0 || nx >= mazeW || ny >= mazeH) continue;
          const nkey = nx + "," + ny;
          if (visited.has(nkey) || maze[ny][nx] !== "#") continue;
          visited.add(nkey);
          stack.push([nx, ny]);
        }
      }
    }
  }
}

let audioCtx = null;

function ensureAudio(){
  if (!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq, duration, type, gainPeak, startDelay){
  if (!audioCtx) return;
  type = type || "square"; gainPeak = gainPeak || 0.15; startDelay = startDelay || 0;
  const t0 = audioCtx.currentTime + startDelay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}

function sweep(freqStart, freqEnd, duration, type, gainPeak){
  if (!audioCtx) return;
  type = type || "square"; gainPeak = gainPeak || 0.15;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}

function noiseBurst(duration, gainPeak){
  if (!audioCtx) return;
  gainPeak = gainPeak || 0.2;
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(gainPeak, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  src.connect(gain).connect(audioCtx.destination);
  src.start();
}

// La Fullscreen API va richiesta in modo sincrono dentro un gestore di click
// reale (un "gesto utente"): non si puo' invocare in un timer o dopo un
// messaggio websocket arrivato in modo asincrono. Per questo la chiediamo
// gia' al click su "Entra in partita"/"Unisciti" (il primo gesto sicuro che
// l'utente compie), cosi' quando la partita parte davvero lo schermo intero
// e' gia' attivo. Su dispositivi che non la supportano per elementi generici
// (es. iOS Safari) la chiamata fallisce silenziosamente e resta comunque
// attivo il fallback CSS (.cabinet.wide, posizionato fixed a copertura
// dell'intero viewport) che funziona ovunque a prescindere dal dispositivo.
function requestFullscreenSafe(){
  const el = document.documentElement;
  try {
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn){
      const p = fn.call(el);
      if (p && p.catch) p.catch(function(){ /* negato o non supportato: ok, resta il fallback CSS */ });
    }
  } catch (e) { /* ok, resta il fallback CSS */ }
}
function resettleCanvas(){
  // Il passaggio a schermo intero (o la rotazione su mobile) cambia le
  // dimensioni del viewport in modo asincrono rispetto all'evento stesso:
  // un solo setupCanvas() immediato a volte legge ancora le misure vecchie.
  // Ripetere la misura per un breve periodo elimina il "layout sbagliato
  // dopo il fullscreen" senza dover indovinare tempi esatti per ogni browser.
  if (currentScreen !== "game" || !mazeW) return;
  setupCanvas();
  [50, 150, 350, 600].forEach(function(ms){
    setTimeout(function(){
      if (currentScreen === "game" && mazeW) setupCanvas();
    }, ms);
  });
}
document.addEventListener("fullscreenchange", resettleCanvas);
window.addEventListener("orientationchange", resettleCanvas);

}

function connect(ip, port, onOpen){
  let url;
  try {
    // Su una pagina servita in HTTPS (es. Netlify) il browser richiede
    // una connessione WebSocket sicura (wss://); in locale/rete LAN via
    // HTTP resta ws:// come prima. La porta e' opzionale: se il server
    // e' hostato (es. Render) non serve indicarla, usa quella standard
    // dell'HTTPS/WSS (443).
    const secure = location.protocol === "https:";
    const scheme = secure ? "wss://" : "ws://";
    const effectivePort = port || (secure ? "" : "8765");
    const portPart = effectivePort ? (":" + effectivePort) : "";
    url = scheme + ip + portPart + "/";
  } catch (e){
    connectError.textContent = "Indirizzo non valido.";
    return;
  }
  try {
    ws = new WebSocket(url);
  } catch (e){
    connectError.textContent = "Impossibile creare la connessione.";
    return;
  }
  ws.onopen = function(){ onOpen(); };
  ws.onmessage = function(ev){ handleMessage(JSON.parse(ev.data)); };
  ws.onerror = function(){
    connectError.textContent = "Errore di connessione al server.";
  };
  ws.onclose = function(){
    if (currentScreen !== "connect"){
      connectError.textContent = "Connessione persa con il server.";
      showScreen("connect");
    }
  };
}

function applyMapData(msg){
  maze = msg.maze; mazeW = msg.maze_w; mazeH = msg.maze_h;
  mazeName = msg.maze_name || "";
  if (msg.theme) mazeTheme = msg.theme;
  portals = Array.isArray(msg.portals) ? msg.portals : [];  // punto 4: due portali
  powerPellets = new Set((msg.power_pellets || []).map(function(c){ return c[0] + "," + c[1]; }));
  computeWallColors();
  eatenPellets.clear();
  beams = []; swirls = [];
  initThemeFx();  // punto 5: particelle atmosferiche a tema
  const mapEl = document.getElementById("hudMap");
  if (mapEl) mapEl.textContent = mazeName ? ("mappa: " + mazeName) : "";
  setupCanvas();
}

// Punto 5 (dettagli grafici a tema): ogni mappa ha un tipo di particella
// atmosferica diverso (braci che salgono per la lava, neve che scende per il
// ghiaccio, foglie, bollicine, stelle, ecc.), indicato da theme.fx. Le
// particelle sono decorative, si muovono in coordinate-cella e sono poche
// (limite 36) per non pesare sul rendering: nessun shadowBlur.
const THEME_FX_COUNT = 36;
function initThemeFx(){
  themeFxKind = (mazeTheme && mazeTheme.fx) || null;
  themeFx = [];
  if (!themeFxKind || !mazeW || !mazeH) return;
  for (let i = 0; i < THEME_FX_COUNT; i++){
    themeFx.push(spawnFxParticle(true));
  }
}
function spawnFxParticle(anywhere){
  // Posizione in coordinate-cella (0..mazeW, 0..mazeH); anywhere=true la
  // sparge su tutta la mappa (init), altrimenti la fa (ri)entrare dal bordo.
  const p = { x: Math.random() * mazeW, y: Math.random() * mazeH,
              phase: Math.random() * Math.PI * 2, seed: Math.random() };
  if (!anywhere){
    switch (themeFxKind){
      case "embers": case "hearts": case "bubbles": case "neon":
        p.y = mazeH + Math.random() * 1.5; break;   // entrano dal basso (salgono)
      case "snow": case "leaves": case "sand":
        p.y = -Math.random() * 1.5; break;          // entrano dall'alto (scendono)
      default:
        p.x = Math.random() * mazeW; p.y = Math.random() * mazeH; // vagano
    }
  }
  return p;
}

function sendMsg(obj){
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function handleMessage(msg){
  switch (msg.type){
    case "room_created":
    case "joined":
      myId = msg.player_id;
      roomCode = msg.code;
      applyMapData(msg);
      document.getElementById("hudRoom").textContent = "stanza " + roomCode;
      break;
    case "error":
      if (currentScreen === "lobby") document.getElementById("lobbyError").textContent = msg.message;
      else connectError.textContent = msg.message;
      break;
    case "lobby_state":
      onLobbyState(msg);
      break;
    case "round_start":
      applyMapData(msg);
      break;
    case "state":
      onState(msg);
      break;
    case "event":
      onGameEvent(msg);
      break;
    case "round_end":
      onRoundEnd(msg);
      break;
  }
}

let roundActive = false; // true durante countdown/playing, per non interrompere la partita

function onLobbyState(msg){
  lobbyPlayersCache = msg.players;
  document.getElementById("lobbyCode").textContent = msg.code;
  const list = document.getElementById("lobbyPlayers");
  list.innerHTML = "";
  msg.players.forEach(function(p){
    const colors = p.colors || [];
    const li = document.createElement("li");
    li.className = "player-row";
    const sw = document.createElement("span");
    sw.className = "swatch";
    const primaryHex = colors[0] ? COLOR_HEX[colors[0]] : "#333";
    sw.style.background = primaryHex;
    sw.style.color = primaryHex;
    sw.style.boxShadow = colors[1] ? ("0 0 0 2px " + COLOR_HEX[colors[1]] + ", 0 0 6px currentColor") : "0 0 6px currentColor";
    li.appendChild(sw);
    const nameSpan = document.createElement("span");
    nameSpan.textContent = p.name;
    li.appendChild(nameSpan);
    if (p.id === myId){
      myColors = colors.slice(); myCharacter = p.character || "classic";
      const t = document.createElement("span"); t.className="tag you"; t.textContent="TU"; li.appendChild(t);
    }
    if (p.host){ const t = document.createElement("span"); t.className="tag host"; t.textContent="HOST"; li.appendChild(t); }
    const spacer = document.createElement("span"); spacer.className="spacer"; li.appendChild(spacer);
    const colTxt = document.createElement("span"); colTxt.style.fontSize="10px"; colTxt.style.color="var(--phosphor-dim)";
    colTxt.textContent = colors.length ? colors.join(" + ") : "nessun colore";
    li.appendChild(colTxt);
    list.appendChild(li);
  });

  renderColorGrid(msg.players);
  renderCharacterGrid(msg.players);

  const me = msg.players.find(function(p){ return p.id === myId; });
  const isHost = me && me.host;
  document.getElementById("btnStart").classList.toggle("hidden", !isHost);
  document.getElementById("waitHostMsg").classList.toggle("hidden", !!isHost);
  const allColored = msg.players.every(function(p){ return p.colors && p.colors.length; });
  document.getElementById("btnStart").disabled = !(isHost && msg.players.length >= msg.min_players && allColored);

  if (!roundActive){
    document.getElementById("lobbyError").textContent = "";
    showScreen("lobby");
  }
}

// Puoi scegliere fino a 2 colori: il primo click sceglie il PRIMARIO
// (corpo), il secondo click il colore di DETTAGLIO (contorno/denti/occhio a
// seconda del personaggio). Ricliccare un colore gia' scelto lo rimuove.
// Solo il colore primario deve restare univoco tra i giocatori (vedi
// taken_primary_colors lato server); il dettaglio si puo' condividere.
function toggleMyColor(cname){
  const idx = myColors.indexOf(cname);
  if (idx !== -1){
    myColors.splice(idx, 1);
  } else if (myColors.length < 2){
    myColors.push(cname);
  } else {
    myColors[1] = cname; // sostituisce il colore di dettaglio, tiene il primario
  }
  sendMsg({ type: "select_color", colors: myColors });
}

function renderColorGrid(players){
  const grid = document.getElementById("colorGrid");
  grid.innerHTML = "";
  const takenPrimaryBy = {};
  players.forEach(function(p){
    if (p.colors && p.colors[0]) takenPrimaryBy[p.colors[0]] = p.id;
  });
  COLOR_NAMES.forEach(function(cname){
    const btn = document.createElement("button");
    btn.className = "color-swatch-btn";
    btn.style.background = COLOR_HEX[cname];
    btn.style.color = COLOR_HEX[cname];
    const myIdx = myColors.indexOf(cname);
    const takenByOther = takenPrimaryBy[cname] && takenPrimaryBy[cname] !== myId && myIdx === -1;
    btn.dataset.taken = takenByOther ? "1" : "0";
    btn.dataset.mine = myIdx === 0 ? "1" : "0";
    if (myIdx === 1){
      btn.style.outline = "2px dashed #fff";
      btn.style.outlineOffset = "2px";
    }
    btn.title = cname + (myIdx === 0 ? " (primario)" : myIdx === 1 ? " (dettaglio)" : "");
    btn.disabled = !!takenByOther;
    btn.addEventListener("click", function(){ toggleMyColor(cname); });
    grid.appendChild(btn);
  });
}

function renderCharacterGrid(players){
  const grid = document.getElementById("characterGrid");
  if (!grid) return;
  grid.innerHTML = "";
  CHARACTERS.forEach(function(c){
    const btn = document.createElement("button");
    btn.className = "char-btn" + (myCharacter === c.id ? " active" : "");
    btn.title = c.label;
    const cv = document.createElement("canvas");
    cv.width = 44; cv.height = 44;
    const cctx = cv.getContext("2d");
    drawCharacterPreview(cctx, c.id);
    btn.appendChild(cv);
    const lbl = document.createElement("div");
    lbl.className = "char-btn-label";
    lbl.textContent = c.label;
    btn.appendChild(lbl);
    btn.addEventListener("click", function(){
      myCharacter = c.id;
      sendMsg({ type: "select_character", character: c.id });
    });
    grid.appendChild(btn);
  });
}

// Piccola anteprima statica del personaggio nella lobby, coi colori
// attualmente selezionati (o un giallo di default se nessuno scelto).
function drawCharacterPreview(pctx, charId){
  const prevCtx = ctx;
  ctx = pctx;
  const primary = myColors[0] ? COLOR_HEX[myColors[0]] : "#ffd400";
  const secondary = myColors[1] ? COLOR_HEX[myColors[1]] : null;
  ctx.clearRect(0, 0, 44, 44);
  ctx.save();
  ctx.translate(22, 22);
  const m = 20 * Math.PI / 180;
  switch (charId){
    case "hex": drawHexBody(16, m, primary, secondary, 0); break;
    case "shark": drawSharkBody(16, m, primary, secondary, 0); break;
    case "cyclops": drawRoundBody(16, m, primary, secondary, 0); drawSingleEye(16, secondary, false); break;
    case "angry": drawRoundBody(16, m, primary, secondary, 0); drawSingleEye(16, secondary, true); break;
    default: drawRoundBody(16, m, primary, secondary, 0); break;
  }
  ctx.restore();
  ctx = prevCtx;
}
