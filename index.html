<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pac-Man Arena 1vAll</title>
<style>
  :root{
    /* ---- design tokens ----
       Cornice UI: terminale hacker fosforescente (coerente col resto dei
       progetti). Il MONDO di gioco (mappa/personaggi) usa invece la
       palette arcade classica, perche' e' quello che rende "veri" i
       personaggi Pac-Man. Il contrasto tra le due e' voluto: un cabinato
       arcade che gira dentro un terminale verde.
    */
    --bg: #030305;
    --panel: #070a08;
    --panel-edge: #0e2a18;
    --phosphor: #35ff8d;
    --phosphor-dim: #14a85c;
    --phosphor-faint: rgba(53,255,141,0.35);
    --marquee-yellow: #ffd400;
    --marquee-yellow-glow: #fff4b8;
    --wall-fill: #0a1440;
    --wall-edge: #2b4bd6;
    --wall-glow: #4d7bff;
    --pellet: #ffe9a8;
    --killer: #ff2b4e;
    --c-azzurro: #29d6ff;
    --c-giallo: #ffd400;
    --c-verde: #33ff77;
    --c-bianco: #f5f5f5;
    --c-rosa: #ff5fd1;
    --danger: #ff4d5e;
    --mono: ui-monospace, "SFMono-Regular", "Courier New", Consolas, monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% 0%, #061006 0%, var(--bg) 60%);
    color: var(--phosphor);
    font-family: var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding: 14px;
    overflow-x:hidden;
  }

  /* ---------- CRT overlay ---------- */
  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 2px, transparent 3px),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
    opacity:0.55;
  }
  @keyframes flicker{
    0%,100%{ opacity:0.55; } 48%{ opacity:0.55; } 50%{ opacity:0.44; } 52%{ opacity:0.55; }
  }
  @media (prefers-reduced-motion: no-preference){
    .crt{ animation: flicker 6.5s infinite; }
  }

  /* ---------- cabinet frame ---------- */
  .cabinet{
    position:relative;
    width:min(640px, 100%);
    transition: width 0.15s ease;
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    background: linear-gradient(180deg, #08110b, #050705);
    box-shadow:
      0 0 0 1px rgba(53,255,141,0.08),
      0 0 40px rgba(53,255,141,0.08),
      inset 0 0 60px rgba(0,0,0,0.6);
    padding: 18px;
  }
  .cabinet::before{
    content:"PAC-MAN ARENA :: 1vALL TERMINAL";
    display:block;
    font-size:10px;
    letter-spacing:2px;
    color: var(--phosphor-dim);
    margin-bottom:10px;
    opacity:0.8;
  }

  .hidden{ display:none !important; }

  h1,h2,h3{ margin:0; font-family:var(--mono); }

  .glow-text{ text-shadow: 0 0 6px var(--phosphor-faint), 0 0 14px var(--phosphor-faint); }

  label{
    display:block; font-size:11px; letter-spacing:1.5px; color:var(--phosphor-dim);
    margin-bottom:4px; text-transform:uppercase;
  }
  input[type=text], input[type=number]{
    width:100%;
    background: #010402;
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor);
    font-family:var(--mono);
    font-size:15px;
    padding: 9px 10px;
    border-radius: 4px;
    outline:none;
  }
  input:focus-visible, button:focus-visible{
    outline: 2px solid var(--marquee-yellow);
    outline-offset: 2px;
  }
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:10px; }
  .row > .field{ flex:1; }

  button{
    font-family:var(--mono);
    cursor:pointer;
    border-radius: 5px;
    border: 1px solid var(--phosphor-dim);
    background: #04140a;
    color: var(--phosphor);
    letter-spacing: 1.5px;
    text-transform:uppercase;
    font-size:12.5px;
    padding: 11px 14px;
    transition: transform 0.05s ease, box-shadow 0.15s ease;
  }
  button:hover{ box-shadow: 0 0 12px var(--phosphor-faint); }
  button:active{ transform: scale(0.97); }
  button.primary{
    background: var(--phosphor-dim);
    color:#04140a;
    border-color: var(--phosphor);
    font-weight:bold;
  }
  button.primary:hover{ box-shadow: 0 0 16px var(--phosphor); }
  button.ghost{ background:transparent; }
  button.danger{ border-color:var(--danger); color:var(--danger); }
  button:disabled{ opacity:0.35; cursor:not-allowed; }
  button.tab{ flex:1; }
  button.tab.active{ background:var(--phosphor-dim); color:#04140a; }

  .btn-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

  /* ---------- title / logo ---------- */
  .title-wrap{ text-align:center; margin-bottom:18px; }
  .title-wrap h1{
    font-size: clamp(22px, 6vw, 32px);
    color: var(--marquee-yellow);
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--marquee-yellow-glow), 0 0 22px rgba(255,212,0,0.5);
  }
  .title-wrap .sub{
    font-size:11px; letter-spacing:4px; color:var(--phosphor-dim); margin-top:4px;
  }
  .logo-canvas{ display:block; margin: 4px auto 10px; }

  .error-box{
    margin-top:10px; font-size:12px; color:var(--danger);
    border-left:2px solid var(--danger); padding-left:8px; min-height:1em;
  }

  /* ---------- lobby ---------- */
  .room-code{
    font-size: clamp(28px,7vw,38px); letter-spacing:6px; color:var(--marquee-yellow);
    text-shadow:0 0 10px rgba(255,212,0,0.5);
    text-align:center; margin: 6px 0 2px;
  }
  .room-code-label{ text-align:center; font-size:10px; letter-spacing:2px; color:var(--phosphor-dim); }
  .player-list{ list-style:none; margin:14px 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .player-row{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--panel-edge); border-radius:5px; padding:7px 10px;
    font-size:13px; background:rgba(53,255,141,0.03);
  }
  .player-row.dead{ opacity:0.4; text-decoration: line-through; }
  .player-row.killer{ border-color:var(--killer); box-shadow:0 0 10px rgba(255,43,78,0.35); }
  .swatch{ width:13px; height:13px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 6px currentColor; }
  .tag{ font-size:10px; padding:1px 5px; border-radius:3px; letter-spacing:1px; }
  .tag.host{ background:var(--marquee-yellow); color:#221900; }
  .tag.you{ border:1px solid var(--phosphor-dim); color:var(--phosphor-dim); }
  .tag.killer{ background:var(--killer); color:#2a0007; }
  .spacer{ flex:1; }

  .color-grid{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .color-swatch-btn{
    width:44px; height:44px; border-radius:50%; border:2px solid transparent; cursor:pointer;
    position:relative;
  }
  .color-swatch-btn[data-taken="1"]{ opacity:0.25; cursor:not-allowed; }
  .color-swatch-btn[data-mine="1"]{ border-color:#fff; box-shadow:0 0 12px currentColor; }

  .char-grid{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .char-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:66px; padding:6px 4px; background:#04140a;
  }
  .char-btn canvas{ display:block; }
  .char-btn-label{ font-size:9px; letter-spacing:0.5px; line-height:1.15; text-align:center; }
  .char-btn.active{ border-color:var(--marquee-yellow); box-shadow:0 0 10px rgba(255,212,0,0.4); }

  /* ---------- game screen ---------- */
  .hud{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; margin-bottom:8px; letter-spacing:1px;
  }
  .hud .timer{ color:var(--phosphor); }
  .hud .timer.urgent{ color:var(--danger); text-shadow:0 0 8px var(--danger); }
  .hud .roomtag{ color:var(--phosphor-dim); font-size:11px; }

  .game-area{ display:flex; min-width:0; min-height:0; }
  .canvas-wrap{
    position:relative; flex:1 1 auto; min-width:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px; overflow:hidden;
    border:1px solid var(--wall-edge);
    box-shadow:0 0 18px rgba(45,75,255,0.25) inset;
    background:#000;
  }
  canvas{ display:block; max-width:100%; max-height:100%; height:auto; }

  /* La sidebar giocatori e' un pannello sovrapposto alla mappa (non ruba
     piu' spazio orizzontale al canvas): cosi' la mappa puo' occupare
     davvero tutto lo schermo, in verticale come in orizzontale. */
  .sidebar{
    position:absolute; top:8px; right:8px; z-index:6;
    display:flex; flex-direction:column; gap:4px;
    max-width:38%; max-height:70%; overflow-y:auto;
    background:rgba(2,6,3,0.62); border:1px solid var(--panel-edge);
    border-radius:8px; padding:6px; backdrop-filter: blur(2px);
  }
  .sidebar .player-row{ font-size:10.5px; padding:4px 6px; white-space:nowrap; }

  .killer-banner{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(20,0,4,0.85); border:1px solid var(--killer); color:var(--killer);
    padding:6px 14px; border-radius:5px; font-size:13px; letter-spacing:2px;
    text-shadow:0 0 8px var(--killer); opacity:0; transition:opacity 0.3s ease;
    pointer-events:none; white-space:nowrap;
  }
  .killer-banner.show{ opacity:1; }

  .end-overlay{
    position:absolute; inset:0; background:rgba(2,3,2,0.86);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:20px;
  }
  .end-overlay h2{ color:var(--marquee-yellow); letter-spacing:2px; text-shadow:0 0 10px rgba(255,212,0,0.5); }
  .end-overlay .winners{ font-size:14px; }
  .end-overlay .winners b{ color:var(--phosphor); }
  .end-overlay .note{ font-size:11px; color:var(--phosphor-dim); margin-top:6px; }

  .toast{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.75); border:1px solid var(--phosphor-dim); color:var(--phosphor);
    padding:5px 12px; border-radius:5px; font-size:11px; opacity:0; transition:opacity 0.4s ease;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  /* ---------- d-pad ---------- */
  .controls-row{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px; flex-wrap:wrap; }
  .hint{ font-size:10.5px; color:var(--phosphor-dim); }
  .dpad{
    display:grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px);
    gap:4px; user-select:none; -webkit-user-select:none;
  }
  .dpad button{ padding:0; font-size:16px; touch-action:manipulation; }
  .dpad .up{ grid-column:2; grid-row:1; }
  .dpad .left{ grid-column:1; grid-row:2; }
  .dpad .right{ grid-column:3; grid-row:2; }
  .dpad .down{ grid-column:2; grid-row:3; }

  .cabinet.wide{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* segue la UI dinamica del browser mobile: niente barre che tagliano la mappa */
    max-width: none;
    border-radius: 0;
    padding: 10px;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
    display: flex;
    flex-direction: column;
    z-index: 40;
  }
  .cabinet.wide::before{ display:none; }
  body.game-fullscreen{ padding:0; }
  .cabinet.wide #screen-game{
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .cabinet.wide .game-area{ flex:1; min-height:0; min-width:0; }
  .cabinet.wide .canvas-wrap{ flex:1; min-height:0; min-width:0; width:100%; height:100%; }
  .cabinet.wide .hud{ flex:0 0 auto; }
  .cabinet.wide .controls-row{ flex:0 0 auto; }

  @media (max-width:480px){
    .cabinet{ padding:12px; }
    .sidebar{ max-width:56%; font-size:10px; }
  }
</style>
</head>
<body>

<div class="crt" aria-hidden="true"></div>

<main class="cabinet">

  <!-- ===================== SCHERMATA: CONNESSIONE ===================== -->
  <section id="screen-connect" class="screen">
    <div class="title-wrap">
      <canvas id="logoCanvas" class="logo-canvas" width="160" height="60"></canvas>
      <h1>PAC-MAN ARENA</h1>
      <div class="sub">1 vs ALL &mdash; fino a 5 giocatori</div>
    </div>

    <div class="field">
      <label for="inpName">Il tuo nome</label>
      <input type="text" id="inpName" maxlength="16" placeholder="Player">
    </div>
    <div class="row">
      <div class="field">
        <label for="inpIp">IP del server</label>
        <input type="text" id="inpIp" placeholder="127.0.0.1">
      </div>
      <div class="field" style="flex:0 0 100px">
        <label for="inpPort">Porta</label>
        <input type="text" id="inpPort" placeholder="8765">
      </div>
    </div>

    <div class="btn-row">
      <button class="tab active" id="tabCreate">Crea stanza</button>
      <button class="tab" id="tabJoin">Unisciti</button>
    </div>

    <div class="field hidden" id="joinCodeField" style="margin-top:10px">
      <label for="inpCode">Codice stanza</label>
      <input type="text" id="inpCode" maxlength="6" placeholder="ABC123" style="text-transform:uppercase">
    </div>

    <div class="btn-row">
      <button class="primary" id="btnConnect" style="flex:1">Entra in partita</button>
    </div>
    <div class="error-box" id="connectError"></div>
  </section>

  <!-- ===================== SCHERMATA: LOBBY ===================== -->
  <section id="screen-lobby" class="screen hidden">
    <div class="room-code-label">codice stanza</div>
    <div class="room-code" id="lobbyCode">------</div>

    <ul class="player-list" id="lobbyPlayers"></ul>

    <label>Scegli colore (primario + dettaglio opzionale)</label>
    <div class="color-grid" id="colorGrid"></div>

    <label>Scegli personaggio</label>
    <div class="char-grid" id="characterGrid"></div>

    <div class="btn-row">
      <button class="primary hidden" id="btnStart" style="flex:1">Avvia partita</button>
      <span id="waitHostMsg" class="hint hidden">In attesa che l'host avvii la partita&hellip;</span>
      <button class="ghost danger" id="btnLeaveLobby">Esci</button>
    </div>
    <div class="error-box" id="lobbyError"></div>
  </section>

  <!-- ===================== SCHERMATA: GIOCO ===================== -->
  <section id="screen-game" class="screen hidden">
    <div class="hud">
      <span class="timer" id="hudTimer">--</span>
      <span class="roomtag" id="hudMap"></span>
      <span class="roomtag" id="hudRoom"></span>
    </div>

    <div class="game-area">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas"></canvas>
        <ul class="sidebar player-list" id="gamePlayers"></ul>
        <div class="killer-banner" id="killerBanner"></div>
        <div class="toast" id="toast"></div>

        <div class="end-overlay hidden" id="endOverlay">
          <h2 id="endTitle">FINE ROUND</h2>
          <div class="winners" id="endWinners"></div>
          <div class="note">si torna in lobby tra pochi secondi&hellip;</div>
        </div>
      </div>
    </div>

    <div class="controls-row">
      <span class="hint">Frecce / WASD per muoverti</span>
      <div class="dpad" aria-label="controlli direzionali">
        <button class="up" data-dir="up">&#9650;</button>
        <button class="left" data-dir="left">&#9664;</button>
        <button class="right" data-dir="right">&#9654;</button>
        <button class="down" data-dir="down">&#9660;</button>
      </div>
      <button class="ghost danger" id="btnLeaveGame">Esci</button>
    </div>
  </section>

</main>

<script>
(function(){
"use strict";

/* =========================================================================
   COSTANTI CONDIVISE COL SERVER (vedi common.py)
   ========================================================================= */
const SERVER_TICK_HZ = 20;
const SERVER_TICK_MS = 1000 / SERVER_TICK_HZ;
const BASE_CELL = 24; // risoluzione interna del canvas, in px per cella

// Devono restare identiche a NORMAL_SPEED / KILLER_SPEED_MULT in common.py:
// servono per calcolare quanto deve durare, in millisecondi, lo scivolamento
// visivo di una pedina da una cella alla successiva. Cosi' l'animazione e'
// fluida per costruzione e non dipende piu' da quanto arrivano puntuali gli
// aggiornamenti di rete dal server.
const NORMAL_SPEED = 4.5;
const KILLER_SPEED_MULT = 1.25;
function cellDurationMs(isKiller){
  const speed = NORMAL_SPEED * (isKiller ? KILLER_SPEED_MULT : 1);
  return 1000 / speed;
}

// Deve restare in sincronia con COLORS in common.py.
const COLOR_HEX = {
  azzurro:    "#29d6ff",
  giallo:     "#ffd400",
  verde:      "#33ff77",
  bianco:     "#f5f5f5",
  rosa:       "#ff5fd1",
  arancione:  "#ff9d1f",
  rosso:      "#ff4136",
  viola:      "#9b3bff",
  lime:       "#c6ff3f",
  oro:        "#ffcf40",
  ciano:      "#22e6ff",
  magenta:    "#ff2b9e",
  grigio:     "#c7d0d8",
  marrone:    "#b5651d",
  blu_notte:  "#5b6bff",
  corallo:    "#ff5a36",
};
const KILLER_COLOR = "#ff2b4e";
const COLOR_NAMES = Object.keys(COLOR_HEX);
const DIR_ANGLE = { right: 0, down: 90, left: 180, up: 270 };
// Deve restare identico a DIRECTIONS in common.py: usato dalla simulazione
// locale (client-side prediction) per muovere SUBITO il proprio personaggio
// alla pressione di un tasto, senza aspettare il giro di rete col server.
const DIR_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// Personaggi selezionabili: id -> etichetta mostrata in lobby. La forma di
// ognuno viene disegnata da drawPacmanVariant() piu' sotto. Deve restare in
// sincronia con CHARACTERS in common.py.
const CHARACTERS = [
  { id: "classic", label: "Classico" },
  { id: "shark",   label: "Denti da squalo" },
  { id: "hex",     label: "Esagonale" },
  { id: "cyclops", label: "Occhio ciclope" },
  { id: "angry",   label: "Occhio arrabbiato" },
];

// Tema visivo della mappa corrente (muri/pellet/sfondo): il server ne sceglie
// uno diverso tra 10 ad ogni inizio partita (vedi round_start), cosi' ogni
// mappa ha davvero una sua identita' cromatica e non solo una forma diversa.
let mazeTheme = { wall: "#0a1440", edge: "#2b4bd6", glow: "#4d7bff", pellet: "#ffe9a8", bg: "#000000" };
let mazeName = "";

// Palette di trii wall/edge/glow usati per colorare a chiazze i gruppi di
// muri connessi della mappa, un po' come le mappe arcade Pac-Man storiche
// che alternavano settori di colori diversi invece di un unico tema piatto.
// Puramente estetico e generato lato client (ogni giocatore vede la propria
// combinazione casuale, non serve sincronizzarlo via rete).
const WALL_PALETTE = [
  { wall: "#0a1440", edge: "#2b4bd6", glow: "#4d7bff" },
  { wall: "#3a0505", edge: "#ff3b3b", glow: "#ff7a5c" },
  { wall: "#03301c", edge: "#12c96f", glow: "#5dffb0" },
  { wall: "#210a3a", edge: "#9b3bff", glow: "#c68cff" },
  { wall: "#402706", edge: "#ff9d1f", glow: "#ffc266" },
  { wall: "#052a33", edge: "#22e6ff", glow: "#9df6ff" },
  { wall: "#3a0524", edge: "#ff2b9e", glow: "#ff8fce" },
  { wall: "#0c2410", edge: "#3ddc4a", glow: "#9dffa5" },
  { wall: "#3a1005", edge: "#ff5a36", glow: "#ffb08a" },
  { wall: "#0a0a3a", edge: "#5b6bff", glow: "#a6b0ff" },
  { wall: "#2b1a00", edge: "#ffcf40", glow: "#ffe38a" },
  { wall: "#001f2b", edge: "#00b8d9", glow: "#7fe8ff" },
  { wall: "#2b0018", edge: "#ff1f7a", glow: "#ff86bb" },
  { wall: "#0d2b06", edge: "#8fd400", glow: "#c9ff6b" },
  { wall: "#20202b", edge: "#8f9bb3", glow: "#c6ceda" },
  { wall: "#2b0b00", edge: "#c1440e", glow: "#ff9560" },
];

// Mappa "x,y" -> indice palette, ricalcolata ad ogni nuova mappa (vedi
// applyMapData). Colora ogni GRUPPO di celle-muro connesse con un colore
// scelto a caso, cosi' la mappa risulta a chiazze multicolori invece che
// di un unico blu/verde/etc uniforme.
let wallColorByCell = {};

function computeWallColors(){
  wallColorByCell = {};
  const visited = new Set();
  let lastIdx = -1;
  for (let y = 0; y < mazeH; y++){
    for (let x = 0; x < mazeW; x++){
      const key = x + "," + y;
      if (maze[y][x] !== "#" || visited.has(key)) continue;
      // BFS sulla regione di muri 4-connessa a partire da qui.
      let idx;
      do { idx = Math.floor(Math.random() * WALL_PALETTE.length); }
      while (WALL_PALETTE.length > 1 && idx === lastIdx);
      lastIdx = idx;
      const stack = [[x, y]];
      visited.add(key);
      while (stack.length){
        const [cx, cy] = stack.pop();
        wallColorByCell[cx + "," + cy] = idx;
        const neighbors = [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
        for (const [nx, ny] of neighbors){
          if (nx < 0 || ny < 0 || nx >= mazeW || ny >= mazeH) continue;
          const nkey = nx + "," + ny;
          if (visited.has(nkey) || maze[ny][nx] !== "#") continue;
          visited.add(nkey);
          stack.push([nx, ny]);
        }
      }
    }
  }
}

function ensureAudio(){
  if (!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq, duration, type, gainPeak, startDelay){
  if (!audioCtx) return;
  type = type || "square"; gainPeak = gainPeak || 0.15; startDelay = startDelay || 0;
  const t0 = audioCtx.currentTime + startDelay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}

function sweep(freqStart, freqEnd, duration, type, gainPeak){
  if (!audioCtx) return;
  type = type || "square"; gainPeak = gainPeak || 0.15;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}

function noiseBurst(duration, gainPeak){
  if (!audioCtx) return;
  gainPeak = gainPeak || 0.2;
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(gainPeak, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  src.connect(gain).connect(audioCtx.destination);
  src.start();
}

function startSiren(){
  if (!audioCtx || sirenNodes) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.value = 220;
  lfo.frequency.value = 1.7;
  lfoGain.gain.value = 55;
  lfo.connect(lfoGain).connect(osc.frequency);
  gain.gain.value = 0.045;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); lfo.start();
  sirenNodes = { osc: osc, lfo: lfo };

function stopSiren(){
  if (!sirenNodes) return;

let lastHeartbeat = 0;
function updateHeartbeat(dist){
  if (dist == null || dist > 4.5) return;
  const interval = Math.max(150, dist * 130);
  const now = performance.now();
  if (now - lastHeartbeat > interval){
    const closeness = Math.max(0, (4.5 - dist) / 4.5);
    tone(78, 0.10, "sine", 0.08 + closeness * 0.14);
    lastHeartbeat = now;
  }
}

   ========================================================================= */
// La Fullscreen API va richiesta in modo sincrono dentro un gestore di click
// reale (un "gesto utente"): non si puo' invocare in un timer o dopo un
// messaggio websocket arrivato in modo asincrono. Per questo la chiediamo
// gia' al click su "Entra in partita"/"Unisciti" (il primo gesto sicuro che
// l'utente compie), cosi' quando la partita parte davvero lo schermo intero
// e' gia' attivo. Su dispositivi che non la supportano per elementi generici
// (es. iOS Safari) la chiamata fallisce silenziosamente e resta comunque
// attivo il fallback CSS (.cabinet.wide, posizionato fixed a copertura
// dell'intero viewport) che funziona ovunque a prescindere dal dispositivo.
function requestFullscreenSafe(){
  const el = document.documentElement;
  try {
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn){
      const p = fn.call(el);
      if (p && p.catch) p.catch(function(){ /* negato o non supportato: ok, resta il fallback CSS */ });
    }
  } catch (e) { /* ok, resta il fallback CSS */ }
}
function resettleCanvas(){
  // Il passaggio a schermo intero (o la rotazione su mobile) cambia le
  // dimensioni del viewport in modo asincrono rispetto all'evento stesso:
  // un solo setupCanvas() immediato a volte legge ancora le misure vecchie.
  // Ripetere la misura per un breve periodo elimina il "layout sbagliato
  // dopo il fullscreen" senza dover indovinare tempi esatti per ogni browser.
  if (currentScreen !== "game" || !mazeW) return;
  setupCanvas();
  [50, 150, 350, 600].forEach(function(ms){
    setTimeout(function(){
      if (currentScreen === "game" && mazeW) setupCanvas();
    }, ms);
  });
}
document.addEventListener("fullscreenchange", resettleCanvas);
window.addEventListener("orientationchange", resettleCanvas);

}

function connect(ip, port, onOpen){
  let url;
  try {
    // Su una pagina servita in HTTPS (es. Netlify) il browser richiede
    // una connessione WebSocket sicura (wss://); in locale/rete LAN via
    // HTTP resta ws:// come prima. La porta e' opzionale: se il server
    // e' hostato (es. Render) non serve indicarla, usa quella standard
    // dell'HTTPS/WSS (443).
    const secure = location.protocol === "https:";
    const scheme = secure ? "wss://" : "ws://";
    const effectivePort = port || (secure ? "" : "8765");
    const portPart = effectivePort ? (":" + effectivePort) : "";
    url = scheme + ip + portPart + "/";
  } catch (e){
    connectError.textContent = "Indirizzo non valido.";
    return;
  }
  try {
    ws = new WebSocket(url);
  } catch (e){
    connectError.textContent = "Impossibile creare la connessione.";
    return;
  }
  ws.onopen = function(){ onOpen(); };
  ws.onmessage = function(ev){ handleMessage(JSON.parse(ev.data)); };
  ws.onerror = function(){
    connectError.textContent = "Errore di connessione al server.";
  };
  ws.onclose = function(){
    if (currentScreen !== "connect"){
      connectError.textContent = "Connessione persa con il server.";
      showScreen("connect");
    }
  };
}

function sendMsg(obj){

function handleMessage(msg){
  switch (msg.type){
    case "room_created":
    case "joined":
      myId = msg.player_id;
      roomCode = msg.code;
      applyMapData(msg);
      document.getElementById("hudRoom").textContent = "stanza " + roomCode;
      break;
    case "error":

}

function toggleMyColor(cname){
  const idx = myColors.indexOf(cname);
  if (idx !== -1){
    myColors.splice(idx, 1);
  } else if (myColors.length < 2){
    myColors.push(cname);

}

// Piccola anteprima statica del personaggio nella lobby, coi colori
// attualmente selezionati (o un giallo di default se nessuno scelto).
function drawCharacterPreview(pctx, charId){
  const prevCtx = ctx;
  ctx = pctx;
  const primary = myColors[0] ? COLOR_HEX[myColors[0]] : "#ffd400";
  const secondary = myColors[1] ? COLOR_HEX[myColors[1]] : null;
  ctx.clearRect(0, 0, 44, 44);
  ctx.save();
  ctx.translate(22, 22);
  const m = 20 * Math.PI / 180;
  switch (charId){
    case "hex": drawHexBody(16, m, primary, secondary, 0); break;
    case "shark": drawSharkBody(16, m, primary, secondary, 0); break;
    case "cyclops": drawRoundBody(16, m, primary, secondary, 0); drawSingleEye(16, secondary, false); break;
    case "angry": drawRoundBody(16, m, primary, secondary, 0); drawSingleEye(16, secondary, true); break;
    default: drawRoundBody(16, m, primary, secondary, 0); break;
  }
  ctx.restore();
  ctx = prevCtx;
}

   ========================================================================= */
const canvas = document.getElementById("gameCanvas");
let ctx = null;
let dpr = window.devicePixelRatio || 1;
let canvasScale = 1; // px canvas (device) per unita' BASE_CELL, condiviso col layer mappa

// La mappa (muri, ombre/glow) non cambia frame per frame: ridisegnarla a
// mano 60 volte al secondo era la causa principale degli "scatti". Ora
// viene disegnata UNA SOLA VOLTA su un canvas offscreen ogni volta che
// cambia la mappa o la dimensione dello schermo, e ad ogni frame si fa solo
// un blit (drawImage) del bitmap gia' pronto: costa quasi nulla alla CPU/GPU.
const mazeLayer = document.createElement("canvas");
// I pallini, come i muri, non cambiano posizione: l'unica cosa che varia
// e' quali sono gia' stati "mangiati". Ridisegnarli tutti con il loro
// glow (shadowBlur, molto costoso per il canvas 2D) ad ogni frame a
// 60fps era la causa principale degli scatti. Ora, come per la mappa,
// vengono disegnati su un layer offscreen che viene rigenerato SOLO
// quando un pallino viene davvero mangiato (evento raro, non 60 volte al
// secondo) o quando cambia la mappa/dimensione schermo; ad ogni frame si
// fa solo un blit.
const pelletsLayer = document.createElement("canvas");
let pelletsLayerDirty = true;

function setupCanvas(){
  const aspect = mazeW / mazeH;
  const wrap = document.getElementById("canvasWrap");
  const availW = Math.max(wrap.clientWidth || 0, 260);
  const availH = Math.max(wrap.clientHeight || 0, window.innerHeight * 0.5, 260);
  let cssW = availW;
  let cssH = cssW / aspect;
  if (cssH > availH){
    cssH = availH;
    cssW = cssH * aspect;
  }

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvasScale = (cssW * dpr) / (mazeW * BASE_CELL);

  canvas.width = Math.round(mazeW * BASE_CELL * canvasScale);
  canvas.height = Math.round(mazeH * BASE_CELL * canvasScale);
  canvas.style.width = Math.round(cssW) + "px";
  canvas.style.height = Math.round(cssH) + "px";
  ctx = canvas.getContext("2d");
  ctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);

  buildMazeLayer();
  pelletsLayer.width = canvas.width;
  pelletsLayer.height = canvas.height;
  buildPelletsLayer();
}

function isWallCell(cx, cy){
  if (cx < 0 || cy < 0 || cy >= mazeH || cx >= mazeW) return true;
  return maze[cy][cx] === "#";
}

function paintMaze(targetCtx){
  targetCtx.fillStyle = mazeTheme.bg || "#000";
  targetCtx.fillRect(0, 0, mazeW * BASE_CELL, mazeH * BASE_CELL);
  for (let y = 0; y < mazeH; y++){
    for (let x = 0; x < mazeW; x++){
      if (maze[y][x] !== "#") continue;
      const px = x * BASE_CELL, py = y * BASE_CELL;
      const m = 1.5, r = 5;
      const palIdx = wallColorByCell[x + "," + y];
      const wc = palIdx != null ? WALL_PALETTE[palIdx] : mazeTheme;
      targetCtx.save();
      targetCtx.shadowColor = wc.glow;
      targetCtx.shadowBlur = 4;
      targetCtx.fillStyle = wc.wall;
      roundRectPath(targetCtx, px + m, py + m, BASE_CELL - 2 * m, BASE_CELL - 2 * m, r);
      targetCtx.fill();
      targetCtx.strokeStyle = wc.edge;
      targetCtx.lineWidth = 1;
      targetCtx.stroke();
      targetCtx.restore();
    }
  }
}

function buildMazeLayer(){
  if (!mazeW || !mazeH) return;
  mazeLayer.width = canvas.width;
  mazeLayer.height = canvas.height;
  const mctx = mazeLayer.getContext("2d");
  mctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
  paintMaze(mctx);
}

function drawMaze(){
  // Blit del bitmap gia' pronto: nessun ridisegno di muri/ombre a runtime.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(mazeLayer, 0, 0);
  ctx.restore();
}

function roundRectPath(targetCtx, x, y, w, h, r){
  targetCtx.beginPath();
  targetCtx.moveTo(x + r, y);
  targetCtx.arcTo(x + w, y, x + w, y + h, r);
  targetCtx.arcTo(x + w, y + h, x, y + h, r);
  targetCtx.arcTo(x, y + h, x, y, r);
  targetCtx.arcTo(x, y, x + w, y, r);
  targetCtx.closePath();
}

function buildPelletsLayer(){
  if (!mazeW || !mazeH) return;
  const pctx = pelletsLayer.getContext("2d");
  pctx.clearRect(0, 0, pelletsLayer.width, pelletsLayer.height);
  pctx.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
  const pelletColor = mazeTheme.pellet || "#ffe9a8";
  pctx.fillStyle = pelletColor;
  pctx.shadowColor = pelletColor;
  pctx.shadowBlur = 3;
  for (let y = 0; y < mazeH; y++){
    for (let x = 0; x < mazeW; x++){
      if (maze[y][x] === "#") continue;
      if (eatenPellets.has(x + "," + y)) continue;
      const cx = x * BASE_CELL + BASE_CELL / 2;
      const cy = y * BASE_CELL + BASE_CELL / 2;
      pctx.beginPath();
      pctx.arc(cx, cy, 2.1, 0, Math.PI * 2);
      pctx.fill();
    }
  }
  pctx.shadowBlur = 0;
  pelletsLayerDirty = false;
}

function drawPellets(){
  if (pelletsLayerDirty) buildPelletsLayer();
  // Blit del bitmap gia' pronto: nessun ridisegno di pallini/glow a runtime.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(pelletsLayer, 0, 0);
  ctx.restore();
}

// ---- corpo "classico" tondo con bocca a spicchio ----
function drawRoundBody(radius, m, primary, secondary, glowExtra){
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, radius, m, Math.PI * 2 - m);
  ctx.closePath();
  ctx.fillStyle = primary;
  ctx.shadowColor = primary;
  ctx.shadowBlur = 8 + (glowExtra || 0);
  ctx.fill();
  ctx.shadowBlur = 0;
  if (secondary){
    ctx.strokeStyle = secondary;
    ctx.lineWidth = Math.max(1.3, radius * 0.10);
    ctx.stroke();
  }
}

// ---- corpo esagonale, bocca ritagliata via composite ----
function drawHexBody(radius, m, primary, secondary, glowExtra){
  const pts = [];
  for (let k = 0; k < 6; k++){
    const a = k * Math.PI / 3;
    pts.push([Math.cos(a) * radius, Math.sin(a) * radius]);
  }
  const path = function(){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 6; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  };
  path();
  ctx.fillStyle = primary;
  ctx.shadowColor = primary;
  ctx.shadowBlur = 8 + (glowExtra || 0);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, radius * 1.05, m, Math.PI * 2 - m);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  if (secondary){
    path();
    ctx.strokeStyle = secondary;
    ctx.lineWidth = Math.max(1.3, radius * 0.10);
    ctx.stroke();
  }
}

// ---- fila di dentini triangolari lungo un bordo della bocca ----
function drawTeethRow(x0, y0, x1, y1, color, toothLen){
  const n = 3;
  const dx = x1 - x0, dy = y1 - y0;
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++){
    const t0 = i / n, t1 = (i + 0.55) / n;
    const bx0 = x0 + dx * t0, by0 = y0 + dy * t0;
    const bx1 = x0 + dx * t1, by1 = y0 + dy * t1;
    const midx = (bx0 + bx1) / 2, midy = (by0 + by1) / 2;
    const apexY = midy - (midy === 0 ? toothLen : Math.sign(midy) * toothLen);
    ctx.beginPath();
    ctx.moveTo(bx0, by0);
    ctx.lineTo(bx1, by1);
    ctx.lineTo(midx, apexY);
    ctx.closePath();
    ctx.fill();
  }
}

// ---- corpo tondo con bocca "a squalo": denti aguzzi sui due bordi ----
function drawSharkBody(radius, m, primary, secondary, glowExtra){
  const arcStart = [Math.cos(m) * radius, Math.sin(m) * radius];
  const arcEnd = [Math.cos(-m) * radius, Math.sin(-m) * radius];
  drawRoundBody(radius, m, primary, null, glowExtra);
  const teethColor = secondary || "#f5f5f5";
  drawTeethRow(0, 0, arcStart[0], arcStart[1], teethColor, radius * 0.22);
  drawTeethRow(0, 0, arcEnd[0], arcEnd[1], teethColor, radius * 0.22);
}

// ---- occhio singolo (ciclope / arrabbiato), colorato col colore di
// dettaglio scelto dal giocatore (iride), con sopracciglio per l'arrabbiato
function drawSingleEye(radius, secondary, angry){
  const eyeR = radius * 0.42;
  const ex = radius * 0.12, ey = 0;
  ctx.beginPath();
  ctx.ellipse(ex, ey, eyeR, eyeR * 0.9, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#f5f7ff";
  ctx.fill();
  const iris = secondary || "#1b2440";
  const pdx = eyeR * 0.35;
  ctx.beginPath();
  ctx.arc(ex + pdx, ey, eyeR * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = iris;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex + pdx, ey, eyeR * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = "#000";
  ctx.fill();
  if (angry){
    ctx.strokeStyle = secondary || "#1b2440";
    ctx.lineWidth = Math.max(1.4, radius * 0.11);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ex - eyeR * 0.95, ey - eyeR * 1.2);
    ctx.lineTo(ex + eyeR * 0.95, ey - eyeR * 0.5);
    ctx.stroke();
  }
}

// Disegna il personaggio scelto dal giocatore: corpo (secondo il tipo) +
// colore primario/dettaglio. rotationDeg orienta l'intero personaggio nella
// direzione di marcia, esattamente come faceva il vecchio drawPacman.
function drawPacmanVariant(px, py, radius, mouthDeg, rotationDeg, primaryHex, secondaryHex, charId, glowExtra){
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(rotationDeg * Math.PI / 180);
  const m = Math.max(2, mouthDeg) * Math.PI / 180;
  switch (charId){
    case "hex":
      drawHexBody(radius, m, primaryHex, secondaryHex, glowExtra);
      break;
    case "shark":
      drawSharkBody(radius, m, primaryHex, secondaryHex, glowExtra);
      break;
    case "cyclops":
      drawRoundBody(radius, m, primaryHex, secondaryHex, glowExtra);
      drawSingleEye(radius, secondaryHex, false);
      break;
    case "angry":
      drawRoundBody(radius, m, primaryHex, secondaryHex, glowExtra);
      drawSingleEye(radius, secondaryHex, true);
      break;
    default:
      drawRoundBody(radius, m, primaryHex, secondaryHex, glowExtra);
      break;
  }
  ctx.restore();
}

// Il killer non diventa piu' un "Pac-Man rosso e piu' grande": prende le
// sembianze del classico fantasmino (cupola + gonnellino ondulato + occhi
// che guardano nella direzione di marcia), mantenendo pero' le stesse
// dimensioni e la stessa velocita' che aveva il Pac-Man killer.
function drawGhost(px, py, r, colorHex, facingDeg, glowExtra){
  ctx.save();
  ctx.translate(px, py);

  ctx.beginPath();
  ctx.moveTo(-r, r * 0.85);
  ctx.arc(0, 0, r, Math.PI, 0, false); // cupola superiore
  ctx.lineTo(r, r * 0.85);
  const scallops = 4;
  const step = (2 * r) / scallops;
  for (let i = 0; i < scallops; i++){
    const xStart = r - i * step;
    const xEnd = xStart - step;
    const xMid = xStart - step / 2;
    const yTip = (i % 2 === 0) ? r * 0.55 : r * 1.02;
    ctx.quadraticCurveTo(xMid, yTip, xEnd, r * 0.85);
  }
  ctx.closePath();
  ctx.fillStyle = colorHex;
  ctx.shadowColor = colorHex;
  ctx.shadowBlur = 8 + (glowExtra || 0);
  ctx.fill();
  ctx.shadowBlur = 0;

  const eyeDX = r * 0.40, eyeDY = -r * 0.08, eyeRX = r * 0.27, eyeRY = r * 0.33;
  [-1, 1].forEach(function(side){
    ctx.beginPath();
    ctx.ellipse(side * eyeDX, eyeDY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#eef4ff";
    ctx.fill();
  });
  const rad = (facingDeg || 0) * Math.PI / 180;
  const pdx = Math.cos(rad) * eyeRX * 0.5, pdy = Math.sin(rad) * eyeRY * 0.5;
  [-1, 1].forEach(function(side){
    ctx.beginPath();
    ctx.arc(side * eyeDX + pdx, eyeDY + pdy, eyeRX * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = "#1b2440";
    ctx.fill();
  });
  ctx.restore();
}

function getRenderedPos(p, now){
  if (p.id === myId && predInited){
    return { x: predGridX + (predDir ? DIR_VEC[predDir][0] * predAccum : 0),
             y: predGridY + (predDir ? DIR_VEC[predDir][1] * predAccum : 0) };
  }
  const a = anim[p.id];
  if (!a) return { x: p.x, y: p.y };
  const t = Math.max(0, Math.min(1, (now - a.start) / a.duration));
  return { x: lerp(a.fromX, a.toX, t), y: lerp(a.fromY, a.toY, t) };
}

// Avanza la simulazione locale del proprio personaggio di `dt` secondi,
// con le stesse regole di common.py/main.py (coda di direzione "next",
// velocita' in celle/secondo, blocco sui muri). Chiamata ad ogni frame
// dal render loop, quindi la risposta al tasto e' visivamente immediata.
function stepLocalPrediction(dt, isKiller){
  if (!predInited || dt <= 0) return;
  const speed = NORMAL_SPEED * (isKiller ? KILLER_SPEED_MULT : 1);
  let remaining = dt;
  // Se il tab e' stato in background, dt puo' essere enorme: limitiamolo
  // per evitare che il personaggio "teletrasporti" attraverso i muri.
  if (remaining > 0.25) remaining = 0.25;

  while (remaining > 0){
    if (predNextDir){
      const v = DIR_VEC[predNextDir];
      if (!isWallCell(predGridX + v[0], predGridY + v[1])){
        predDir = predNextDir;
        predNextDir = null;
      }
    }
    if (!predDir){ break; }
    const v = DIR_VEC[predDir];
    const nx = predGridX + v[0], ny = predGridY + v[1];
    if (isWallCell(nx, ny)){
      predAccum = 0;
      break;
    }
    const step = Math.min(remaining, (1 - predAccum) / speed);
    predAccum += speed * step;
    remaining -= step;
    if (predAccum >= 1 - 1e-6){
      predAccum = 0;
      predGridX = nx;
      predGridY = ny;
    } else {
      break;
    }
  }
}

let lastFacingMap = {};
function computeFacing(p){
  if (p.id === myId && predInited && predDir){
    return DIR_ANGLE[predDir];
  }
  const a = anim[p.id];
  if (a && (a.toX !== a.fromX || a.toY !== a.fromY)){
    const ddx = a.toX - a.fromX, ddy = a.toY - a.fromY;
    if (Math.abs(ddx) > Math.abs(ddy)) return ddx > 0 ? DIR_ANGLE.right : DIR_ANGLE.left;
    if (ddy !== 0) return ddy > 0 ? DIR_ANGLE.down : DIR_ANGLE.up;
  }
  return lastFacingMap[p.id] || 0;
}

function drawPlayers(players, now){
  players.forEach(function(p){
    const pos = getRenderedPos(p, now);
    const px = pos.x * BASE_CELL + BASE_CELL / 2;
    const py = pos.y * BASE_CELL + BASE_CELL / 2;

    if (!p.alive) return;

    const facing = computeFacing(p);
    lastFacingMap[p.id] = facing;
    const isKiller = p.is_killer;
    const chompSpeed = isKiller ? 11 : 8;
    const mouthDeg = 8 + 24 * Math.abs(Math.sin(now / 1000 * chompSpeed));
    const colors = p.colors || [];
    const baseColor = isKiller ? KILLER_COLOR : (COLOR_HEX[colors[0]] || "#fff");
    const detailColor = colors[1] ? COLOR_HEX[colors[1]] : null;
    const radius = (isKiller ? BASE_CELL * 0.50 : BASE_CELL * 0.42);

    if (isKiller){
      const pulse = 4 + 3 * Math.abs(Math.sin(now / 220));
      ctx.save();
      ctx.beginPath();
      ctx.arc(px, py, radius + pulse, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,43,78,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    if (isKiller){
      drawGhost(px, py, radius, baseColor, facing, 10);
    } else {
      drawPacmanVariant(px, py, radius, mouthDeg, facing, baseColor, detailColor, p.character || "classic", 0);
    }

    ctx.save();
    ctx.font = "8px " + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center";
    ctx.fillStyle = "#000";
    ctx.globalAlpha = 0.7;
    ctx.fillText(p.name, px + 0.5, py - radius - 4.5);
    ctx.globalAlpha = 1;
    ctx.fillStyle = isKiller ? KILLER_COLOR : baseColor;
    ctx.fillText(p.name, px, py - radius - 5);
    ctx.restore();
  });
}

function findPlayer(snapshot, id){
  if (!snapshot) return null;
  for (let i = 0; i < snapshot.players.length; i++){
    if (snapshot.players[i].id === id) return snapshot.players[i];
  }
  return null;
}
function lerp(a, b, t){ return a + (b - a) * t; }

function drawExplosions(now){
  explosions = explosions.filter(function(e){ return now - e.start < 550; });
  explosions.forEach(function(e){
    const t = (now - e.start) / 550;
    const px = e.x * BASE_CELL + BASE_CELL / 2;
    const py = e.y * BASE_CELL + BASE_CELL / 2;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, 4 + t * 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

function renderLoop(now){
  requestAnimationFrame(renderLoop);
  if (currentScreen !== "game" || !ctx || !currSnapshot) return;

  const dt = lastFrameTs != null ? Math.max(0, (now - lastFrameTs) / 1000) : 0;
  lastFrameTs = now;
  const me0 = findPlayer(currSnapshot, myId);
  if (me0 && me0.alive && roundActive){
    stepLocalPrediction(dt, !!me0.is_killer);
  }

  drawMaze();
  drawPellets();
  drawPlayers(currSnapshot.players, now);
  drawExplosions(now);

  const banner = document.getElementById("killerBanner");
  if (now < killerBannerUntil) banner.classList.add("show");
  else banner.classList.remove("show");

  const me = findPlayer(currSnapshot, myId);
  const killer = currSnapshot.killer_id ? findPlayer(currSnapshot, currSnapshot.killer_id) : null;
  if (me && killer && me.alive && !me.is_killer && currSnapshot.phase === "playing"){
    const dist = Math.hypot(me.x - killer.x, me.y - killer.y);
    updateHeartbeat(dist);
  }
}
requestAnimationFrame(renderLoop);

window.addEventListener("resize", function(){ if (mazeW) setupCanvas(); });

// ResizeObserver sul contenitore del canvas: e' il modo affidabile per
// accorgersi che lo spazio disponibile e' cambiato in QUALSIASI
// situazione (entrata/uscita da fullscreen, comparsa/scomparsa della
// barra degli indirizzi su mobile, zoom, resize finestra, apertura
// devtools...). L'evento "resize" della finestra da solo non copre tutti
// questi casi, ed e' la causa principale del "quadratino piccolo" che
// restava bloccato dopo il primo render.
if (typeof ResizeObserver !== "undefined"){
  const canvasWrapEl = document.getElementById("canvasWrap");
  let roScheduled = false;
  const ro = new ResizeObserver(function(){
    if (roScheduled) return;
    roScheduled = true;
    requestAnimationFrame(function(){
      roScheduled = false;
      if (currentScreen === "game" && mazeW) setupCanvas();
    });
  });
  ro.observe(canvasWrapEl);
}

/* =========================================================================
   LOGO ANIMATO (schermata di connessione)
   ========================================================================= */
(function animateLogo(){
  const lc = document.getElementById("logoCanvas");
  const lctx = lc.getContext("2d");
  function frame(now){
    requestAnimationFrame(frame);
    lctx.clearRect(0, 0, lc.width, lc.height);
    const mouth = 8 + 26 * Math.abs(Math.sin(now / 260));
    lctx.save();
    lctx.translate(lc.width / 2, lc.height / 2);
    lctx.beginPath();
    lctx.moveTo(0, 0);
    const m = mouth * Math.PI / 180;
    lctx.arc(0, 0, 22, m, Math.PI * 2 - m);
    lctx.closePath();
    lctx.fillStyle = "#ffd400";
    lctx.shadowColor = "#ffd400";
    lctx.shadowBlur = 16;
    lctx.fill();
    lctx.restore();
  }
  requestAnimationFrame(frame);
})();

/* =========================================================================
   STATO DI GIOCO / EVENTI
   ========================================================================= */
function onState(msg){
  const now = performance.now();

  if (msg.phase === "countdown" && lastPhase !== "countdown"){
    eatenPellets.clear();
    pelletsLayerDirty = true;
    explosions = [];
    lastAliveMap = {};
    anim = {};
    lastServerPos = {};
    lastFacingMap = {};
    lastKnownKillerId = null;
    heldDirs = [];
    lastRequestedDir = null;
    predInited = false;
    predDir = null;
    predNextDir = null;
    predAccum = 0;
    startSiren();
    roundActive = true;
    document.getElementById("endOverlay").classList.add("hidden");
    showScreen("game");
  }

  // Rivela il killer sia alla prima scelta (fine countdown) sia ogni volta
  // che cambia durante il round (rotazione ogni KILLER_INTERVAL_SECONDS).
  if (msg.phase === "playing" && msg.killer_id && msg.killer_id !== lastKnownKillerId){
    stopSiren();
    playKillerReveal();
    killerBannerUntil = now + 1600;
    const killer = findPlayer(msg, msg.killer_id);
    document.getElementById("killerBanner").textContent =
      killer ? ("IL KILLER E' " + killer.name.toUpperCase() + "!") : "IL KILLER E' STATO SCELTO!";
    lastKnownKillerId = msg.killer_id;
  }

  msg.players.forEach(function(p){
    if (lastAliveMap[p.id] === true && p.alive === false){
      explosions.push({ x: p.x, y: p.y, color: p.is_killer ? KILLER_COLOR : (COLOR_HEX[(p.colors && p.colors[0])] || "#fff"), start: now });
      playEliminate();
      if (p.id !== myId) showToast(p.name + " eliminato!");
    }
    lastAliveMap[p.id] = p.alive;

    // Il pallino sotto la pedina viene "mangiato" al passaggio. Farlo qui
    // (al ritmo dei tick di stato, ~20/s) invece che nel render loop
    // permette di far scattare il classico "waka-waka" una volta sola per
    // pallino, per il proprio giocatore.
    if (p.alive){
      const cellKey = Math.round(p.x) + "," + Math.round(p.y);
      if (!eatenPellets.has(cellKey)){
        eatenPellets.add(cellKey);
        pelletsLayerDirty = true;
        if (p.id === myId) playChomp();
      }
    }

    // Anima uno scivolamento fluido verso la nuova posizione confermata dal
    // server, con una durata pari al tempo reale che ci mette una pedina a
    // percorrere una cella a quella velocita' -- fluido a prescindere da
    // quanto e' puntuale la rete.
    const last = lastServerPos[p.id];
    if (!last){
      anim[p.id] = { fromX: p.x, fromY: p.y, toX: p.x, toY: p.y, start: now, duration: 1 };
    } else if (last.x !== p.x || last.y !== p.y){
      const from = getRenderedPos(p, now);
      anim[p.id] = { fromX: from.x, fromY: from.y, toX: p.x, toY: p.y, start: now, duration: cellDurationMs(p.is_killer) };
    }
    lastServerPos[p.id] = { x: p.x, y: p.y };
  });
  lastPhase = msg.phase;

  // Inizializza o ri-allinea (in modo "morbido") la simulazione locale del
  // proprio personaggio rispetto alla posizione confermata dal server: il
  // server resta l'autorita', il client predice solo per eliminare la
  // latenza percepita. Un piccolo scarto (una cella) e' normale e atteso
  // (il client e' avanti di quel poco che la rete impiega ad arrivare); uno
  // scarto grande (spawn, respawn, blocco imprevisto) viene corretto subito.
  const myServerP = findPlayer(msg, myId);
  if (myServerP){
    if (!predInited){
      predGridX = myServerP.x;
      predGridY = myServerP.y;
      predAccum = 0;
      predInited = true;
    } else {
      const dx = Math.abs(predGridX - myServerP.x);
      const dy = Math.abs(predGridY - myServerP.y);
      if (dx > 1 || dy > 1 || !myServerP.alive){
        predGridX = myServerP.x;
        predGridY = myServerP.y;
        predAccum = 0;
      }
    }
  }

  currSnapshot = msg;
  snapshotTime = now;

  updateHud(msg);
  updateGameSidebar(msg);
}

function updateHud(msg){
  const timerEl = document.getElementById("hudTimer");
  if (msg.phase === "countdown"){
    timerEl.textContent = "IL KILLER SARA' SVELATO TRA " + Math.ceil(msg.countdown) + "s (puoi gia' muoverti)";
    timerEl.classList.remove("urgent");
  } else {
    const nextKiller = msg.killer_timer != null ? Math.ceil(msg.killer_timer) : null;
    timerEl.textContent = "TEMPO: " + Math.ceil(msg.timer) + "s" +
      (nextKiller != null ? " · PROSSIMO CAMBIO KILLER TRA " + nextKiller + "s" : "");
    timerEl.classList.toggle("urgent", msg.timer <= 10);
  }
}

let lastSidebarSig = "";
function updateGameSidebar(msg){
  // La sidebar arriva dentro ogni pacchetto di stato (~20 volte al
  // secondo), ma i dati che mostra (vivo/morto, chi e' il killer, nome,
  // colori) cambiano molto di rado: posizione e movimento NON la
  // riguardano. Ricostruire l'intera lista nel DOM ad ogni pacchetto era
  // lavoro sprecato che contribuiva agli scatti; la si ricostruisce solo
  // quando qualcosa di rilevante e' davvero cambiato.
  const sig = myId + "|" + msg.players.map(function(p){
    return p.id + ":" + p.alive + ":" + p.is_killer + ":" + p.name + ":" + (p.colors || []).join(",");
  }).join("|");
  if (sig === lastSidebarSig) return;
  lastSidebarSig = sig;

  const list = document.getElementById("gamePlayers");
  list.innerHTML = "";
  msg.players.forEach(function(p){
    const li = document.createElement("li");
    li.className = "player-row" + (!p.alive ? " dead" : "") + (p.is_killer ? " killer" : "");
    const sw = document.createElement("span");
    sw.className = "swatch";
    const colors = p.colors || [];
    const c = p.is_killer ? KILLER_COLOR : (COLOR_HEX[colors[0]] || "#888");
    sw.style.background = c; sw.style.color = c;
    if (!p.is_killer && colors[1]){
      sw.style.boxShadow = "0 0 0 2px " + COLOR_HEX[colors[1]] + ", 0 0 6px currentColor";
    }
    li.appendChild(sw);
    const nameSpan = document.createElement("span");
    nameSpan.textContent = p.name;
    li.appendChild(nameSpan);
    if (p.id === myId){ const t = document.createElement("span"); t.className="tag you"; t.textContent="TU"; li.appendChild(t); }
    if (p.is_killer){ const t = document.createElement("span"); t.className="tag killer"; t.textContent="KILLER"; li.appendChild(t); }
    list.appendChild(li);
  });
}

function onRoundEnd(msg){
  roundActive = false;
  stopSiren();
  const iWon = msg.winners.indexOf(myId) !== -1;
  if (iWon) playVictory(); else playGameOver();

  const overlay = document.getElementById("endOverlay");
  const title = document.getElementById("endTitle");
  const winners = document.getElementById("endWinners");
  if (msg.reason === "killer_wins") title.textContent = "IL KILLER HA VINTO";
  else if (msg.reason === "last_survivor") title.textContent = "ULTIMO SOPRAVVISSUTO!";
  else title.textContent = "TEMPO SCADUTO";

  winners.innerHTML = "";
  msg.winners.forEach(function(wid){
    const div = document.createElement("div");
    const isMe = wid === myId;
    div.innerHTML = (isMe ? "<b>" : "") + (msg.names[wid] || wid) + (isMe ? " (TU!)</b>" : "");
    winners.appendChild(div);
  });
  overlay.classList.remove("hidden");
}

/* =========================================================================
   INPUT: TASTIERA + D-PAD TOUCH
   Il personaggio si muove SOLO mentre il tasto/pulsante e' tenuto premuto:
   appena viene rilasciato (e nessun'altra direzione e' ancora premuta) si
   invia "stop" al server, che ferma subito il personaggio nella cella in
   cui si trova. Questo elimina sia il "si muove da solo" sia i problemi di
   tempismo: il movimento segue esattamente cio' che il giocatore sta
   facendo in quel momento.
   ========================================================================= */
const KEY_TO_DIR = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
  W: "up", S: "down", A: "left", D: "right",
};

// Pila delle direzioni attualmente tenute premute: l'ultima aggiunta e'
// quella "attiva" (se si tengono premute due frecce insieme, vince quella
// premuta piu' di recente, e rilasciandola si torna automaticamente
// all'altra ancora tenuta, invece di fermarsi del tutto).
let heldDirs = [];
let lastRequestedDir = null;

function activateDir(dir){
  heldDirs = heldDirs.filter(function(d){ return d !== dir; });
  heldDirs.push(dir);
  if (dir !== lastRequestedDir){ playTurn(); lastRequestedDir = dir; }
  predNextDir = dir;
  sendMsg({ type: "move", direction: dir });
}
function releaseDir(dir){
  heldDirs = heldDirs.filter(function(d){ return d !== dir; });
  if (heldDirs.length){
    const next = heldDirs[heldDirs.length - 1];
    lastRequestedDir = next;
    predNextDir = next;
    sendMsg({ type: "move", direction: next });
  } else {
    lastRequestedDir = null;
    predDir = null;
    predNextDir = null;
    predAccum = 0;
    sendMsg({ type: "stop" });
  }
}

document.addEventListener("keydown", function(ev){
  if (currentScreen !== "game") return;
  const dir = KEY_TO_DIR[ev.key];
  if (dir){
    if (!ev.repeat) activateDir(dir);
    ev.preventDefault();
  }
});
document.addEventListener("keyup", function(ev){
  const dir = KEY_TO_DIR[ev.key];
  if (dir) releaseDir(dir);
});
// Se la finestra/scheda perde il focus mentre un tasto e' premuto, il
// browser non manda sempre il keyup corrispondente: senza questo il
// personaggio continuerebbe a muoversi "da solo" anche se non si sta piu'
// premendo nulla. Alla perdita di focus si ferma tutto per sicurezza.
window.addEventListener("blur", function(){
  if (heldDirs.length){
    heldDirs = [];
    lastRequestedDir = null;
    sendMsg({ type: "stop" });
  }
});

// D-pad touch: si muove solo mentre il dito resta premuto sul pulsante.
document.querySelectorAll(".dpad button").forEach(function(btn){
  const dir = btn.dataset.dir;
  const start = function(ev){
    ev.preventDefault();
    ensureAudio();
    activateDir(dir);
  };
  const stop = function(){
    releaseDir(dir);
  };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", stop);
  btn.addEventListener("pointerleave", stop);
  btn.addEventListener("pointercancel", stop);
});

})();
</script>
